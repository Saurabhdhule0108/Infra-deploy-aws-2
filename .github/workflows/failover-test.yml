
name: Active-Passive Failover Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  failover-test:
    name: Verify Nginx Active-Passive Failover
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      RDS_IDENTIFIER: infra-deploy-aws-mysql
      PRIMARY_STOPPED: "false"

    steps:
      # =====================================================
      # CHECKOUT AND AWS AUTHENTICATION
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # =====================================================
      # READ EXISTING TERRAFORM STATE
      # NO TERRAFORM APPLY IN THIS WORKFLOW
      # =====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Get existing EC2 instance IDs
        working-directory: terraform
        run: |
          set -euo pipefail

          APP1=$(terraform output -raw instance_id)
          APP2=$(terraform output -raw instance_2_id)

          test -n "$APP1"
          test -n "$APP2"
          test "$APP1" != "$APP2"

          echo "EC2_INSTANCE_ID=$APP1" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_2_ID=$APP2" >> "$GITHUB_ENV"

          echo "Primary: $APP1"
          echo "Backup: $APP2"

      # =====================================================
      # ENSURE RDS IS AVAILABLE
      # =====================================================

      - name: Start RDS if necessary
        run: |
          set -euo pipefail

          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_IDENTIFIER" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)

          echo "RDS status: $STATUS"

          case "$STATUS" in
            available|starting|backing-up|modifying)
              echo "Waiting for RDS readiness."
              ;;
            stopped)
              aws rds start-db-instance \
                --db-instance-identifier "$RDS_IDENTIFIER"
              ;;
            stopping)
              aws rds wait db-instance-stopped \
                --db-instance-identifier "$RDS_IDENTIFIER"

              aws rds start-db-instance \
                --db-instance-identifier "$RDS_IDENTIFIER"
              ;;
            *)
              echo "Unsupported RDS state: $STATUS"
              exit 1
              ;;
          esac

      - name: Wait for RDS
        run: |
          aws rds wait db-instance-available \
            --db-instance-identifier "$RDS_IDENTIFIER"

          echo "RDS is available."

      # =====================================================
      # START EXISTING EC2 INSTANCES
      # =====================================================

      - name: Start both EC2 instances if stopped
        run: |
          set -euo pipefail

          for INSTANCE_ID in \
            "$EC2_INSTANCE_ID" "$EC2_INSTANCE_2_ID"; do

            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text)

            echo "$INSTANCE_ID: $STATE"

            case "$STATE" in
              stopped)
                aws ec2 start-instances \
                  --instance-ids "$INSTANCE_ID"
                ;;
              running|pending)
                echo "Instance already running or starting."
                ;;
              *)
                echo "Unexpected EC2 state: $STATE"
                exit 1
                ;;
            esac
          done

      - name: Wait for both EC2 instances
        run: |
          set -euo pipefail

          aws ec2 wait instance-running \
            --instance-ids \
            "$EC2_INSTANCE_ID" "$EC2_INSTANCE_2_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids \
            "$EC2_INSTANCE_ID" "$EC2_INSTANCE_2_ID"

          echo "Both EC2 instances are ready."

      - name: Get current EC2 addresses
        run: |
          set -euo pipefail

          APP1_PUBLIC=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          APP2_PUBLIC=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_2_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          APP2_PRIVATE=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_2_ID" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)

          for ADDRESS in \
            "$APP1_PUBLIC" "$APP2_PUBLIC" "$APP2_PRIVATE"; do
            test -n "$ADDRESS"
            test "$ADDRESS" != "None"
          done

          echo "EC2_PUBLIC_IP=$APP1_PUBLIC" >> "$GITHUB_ENV"
          echo "EC2_PUBLIC_IP_2=$APP2_PUBLIC" >> "$GITHUB_ENV"
          echo "EC2_PRIVATE_IP_2=$APP2_PRIVATE" >> "$GITHUB_ENV"

          echo "Primary public IP: $APP1_PUBLIC"
          echo "Backup public IP: $APP2_PUBLIC"
          echo "Backup private IP: $APP2_PRIVATE"

      # =====================================================
      # SECURE SSH
      # =====================================================

      - name: Prepare SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          printf '%s\n' "$SSH_PRIVATE_KEY" > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Verify SSH host keys
        env:
          APP1_SSH_HOST_KEY: ${{ vars.APP1_SSH_HOST_KEY }}
          APP2_SSH_HOST_KEY: ${{ vars.APP2_SSH_HOST_KEY }}
        run: bash ansible/prepare-ssh.sh

      - name: Wait for SSH on both servers
        run: |
          set -euo pipefail

          for SERVER_IP in \
            "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2"; do

            READY=false

            for i in {1..30}; do
              if ssh \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -o ConnectTimeout=10 \
                -i ec2-key.pem \
                "ubuntu@$SERVER_IP" \
                "echo SSH_READY" >/dev/null 2>&1; then

                READY=true
                break
              fi

              sleep 10
            done

            if [ "$READY" != "true" ]; then
              echo "SSH unavailable on $SERVER_IP"
              exit 1
            fi
          done

          echo "SSH ready on both servers."

      # =====================================================
      # PRE-FLIGHT CHECKS
      # =====================================================

      - name: Verify containers and Nginx
        run: |
          set -euo pipefail

          for SERVER_IP in \
            "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2"; do

            ssh -o StrictHostKeyChecking=yes \
              -i ec2-key.pem \
              "ubuntu@$SERVER_IP" \
              "sudo docker inspect \
                --format '{{.State.Running}}' \
                infra-deploy-aws-app | grep -x true"
          done

          ssh -o StrictHostKeyChecking=yes \
            -i ec2-key.pem \
            "ubuntu@$EC2_PUBLIC_IP" \
            "sudo nginx -t && sudo systemctl is-active nginx"

      - name: Identify both application backends
        run: |
          set -euo pipefail

          PRIMARY_JSON=$(ssh \
            -o StrictHostKeyChecking=yes \
            -i ec2-key.pem \
            "ubuntu@$EC2_PUBLIC_IP" \
            "curl -fsS http://127.0.0.1:8080/health")

          BACKUP_JSON=$(ssh \
            -o StrictHostKeyChecking=yes \
            -i ec2-key.pem \
            "ubuntu@$EC2_PUBLIC_IP_2" \
            "curl -fsS http://127.0.0.1:8080/health")

          PRIMARY_HOST=$(printf '%s' "$PRIMARY_JSON" \
            | jq -er 'select(.status=="healthy") | .hostname')

          BACKUP_HOST=$(printf '%s' "$BACKUP_JSON" \
            | jq -er 'select(.status=="healthy") | .hostname')

          test -n "$PRIMARY_HOST"
          test -n "$BACKUP_HOST"

          if [ "$PRIMARY_HOST" = "$BACKUP_HOST" ]; then
            echo "ERROR: Both backends have the same hostname."
            exit 1
          fi

          echo "PRIMARY_HOST=$PRIMARY_HOST" >> "$GITHUB_ENV"
          echo "BACKUP_HOST=$BACKUP_HOST" >> "$GITHUB_ENV"

          echo "App-1 hostname: $PRIMARY_HOST"
          echo "App-2 hostname: $BACKUP_HOST"

      # =====================================================
      # PHASE 1: VERIFY NORMAL PRIMARY ROUTING
      # =====================================================

      - name: Phase 1 - Verify App-1 is active
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            "http://$EC2_PUBLIC_IP/health")

          ACTUAL=$(printf '%s' "$RESPONSE" \
            | jq -er 'select(.status=="healthy") | .hostname')

          echo "Expected primary: $PRIMARY_HOST"
          echo "Actual backend: $ACTUAL"

          if [ "$ACTUAL" != "$PRIMARY_HOST" ]; then
            echo "ERROR: Nginx is not routing to App-1."
            exit 1
          fi

          DB_STATUS=$(curl -fsS \
            "http://$EC2_PUBLIC_IP/db" \
            | jq -er '.status')

          test "$DB_STATUS" = "success"

          echo "PHASE 1 PASSED: App-1 is active and RDS works."

      # =====================================================
      # PHASE 2: SIMULATE PRIMARY APPLICATION FAILURE
      # =====================================================

      - name: Phase 2 - Stop App-1 Docker container
        run: |
          set -euo pipefail

          # Record restoration requirement BEFORE stopping.
          echo "PRIMARY_STOPPED=true" >> "$GITHUB_ENV"

          ssh -o StrictHostKeyChecking=yes \
            -i ec2-key.pem \
            "ubuntu@$EC2_PUBLIC_IP" \
            "sudo docker stop infra-deploy-aws-app"

          echo "App-1 container stopped."
          echo "App-1 EC2 and Nginx remain running."

      - name: Confirm App-1 application is down
        run: |
          set -euo pipefail

          if ssh -o StrictHostKeyChecking=yes \
            -i ec2-key.pem \
            "ubuntu@$EC2_PUBLIC_IP" \
            "curl -fsS --connect-timeout 3 \
              http://127.0.0.1:8080/health >/dev/null"; then

            echo "ERROR: Primary application is still responding."
            exit 1
          fi

          echo "PHASE 2 PASSED: Primary application is down."

      # =====================================================
      # PHASE 3: VERIFY NGINX ROUTES TO APP-2
      # =====================================================

      - name: Phase 3 - Verify failover to App-2
        run: |
          set -euo pipefail

          SUCCESS=false

          for i in {1..15}; do
            RESPONSE=$(curl -fsS \
              --max-time 10 \
              "http://$EC2_PUBLIC_IP/health" || true)

            ACTUAL=$(printf '%s' "$RESPONSE" \
              | jq -r '.hostname // empty' 2>/dev/null || true)

            echo "Observed backend: ${ACTUAL:-unavailable}"

            if [ "$ACTUAL" = "$BACKUP_HOST" ]; then
              SUCCESS=true
              break
            fi

            sleep 3
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: Nginx did not switch to App-2."
            exit 1
          fi

          DB_STATUS=$(curl -fsS \
            "http://$EC2_PUBLIC_IP/db" \
            | jq -er '.status')

          test "$DB_STATUS" = "success"

          echo "PHASE 3 PASSED: App-2 serves traffic and RDS works."

      # =====================================================
      # PHASE 4: RESTORE PRIMARY EVEN AFTER A TEST FAILURE
      # =====================================================

      - name: Phase 4 - Restore App-1 container
        if: ${{ always() && env.PRIMARY_STOPPED == 'true' }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes \
            -i ec2-key.pem \
            "ubuntu@$EC2_PUBLIC_IP" \
            "sudo docker start infra-deploy-aws-app"

          echo "Primary container restart requested."

      - name: Verify App-1 application recovery
        if: ${{ always() && env.PRIMARY_STOPPED == 'true' }}
        run: |
          set -euo pipefail

          RECOVERED=false

          for i in {1..15}; do
            RESPONSE=$(ssh \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -i ec2-key.pem \
              "ubuntu@$EC2_PUBLIC_IP" \
              "curl -fsS \
                http://127.0.0.1:8080/health" || true)

            ACTUAL=$(printf '%s' "$RESPONSE" \
              | jq -r '.hostname // empty' 2>/dev/null || true)

            if [ "$ACTUAL" = "$PRIMARY_HOST" ]; then
              RECOVERED=true
              break
            fi

            sleep 5
          done

          if [ "$RECOVERED" != "true" ]; then
            echo "ERROR: App-1 did not recover."
            exit 1
          fi

          echo "PHASE 4 PASSED: App-1 application recovered."

      # =====================================================
      # PHASE 5: VERIFY NGINX RETURNS TO PRIMARY
      # =====================================================

      - name: Phase 5 - Verify primary routing restored
        if: ${{ success() && env.PRIMARY_STOPPED == 'true' }}
        run: |
          set -euo pipefail

          RECOVERED=false

          for i in {1..15}; do
            RESPONSE=$(curl -fsS \
              --max-time 10 \
              "http://$EC2_PUBLIC_IP/health" || true)

            ACTUAL=$(printf '%s' "$RESPONSE" \
              | jq -r '.hostname // empty' 2>/dev/null || true)

            echo "Current backend: ${ACTUAL:-unavailable}"

            if [ "$ACTUAL" = "$PRIMARY_HOST" ]; then
              RECOVERED=true
              break
            fi

            sleep 3
          done

          if [ "$RECOVERED" != "true" ]; then
            echo "ERROR: Nginx did not return to App-1."
            exit 1
          fi

          DB_STATUS=$(curl -fsS \
            "http://$EC2_PUBLIC_IP/db" \
            | jq -er '.status')

          test "$DB_STATUS" = "success"

          echo "======================================"
          echo "ACTIVE-PASSIVE FAILOVER TEST PASSED"
          echo "======================================"
          echo "App-1: Active and recovered"
          echo "App-2: Healthy backup"
          echo "Nginx: Failover and recovery verified"
          echo "RDS: Connected"
          echo "Both EC2 instances remain RUNNING"
          echo "RDS remains RUNNING"
          echo "======================================"
