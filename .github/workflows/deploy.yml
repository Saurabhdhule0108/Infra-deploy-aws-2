name: CI/CD with Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_ami_id: ${{ vars.AWS_AMI_ID }}
      TF_VAR_key_name: ${{ vars.AWS_KEY_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      # =====================================================
      # SOURCE CODE
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # =====================================================
      # AWS AUTHENTICATION USING OIDC
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # =====================================================
      # TERRAFORM
      # =====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # =====================================================
      # GET TERRAFORM OUTPUTS
      # =====================================================

      - name: Get Terraform outputs
        working-directory: terraform
        run: |
          EC2_INSTANCE_ID=$(terraform output -raw instance_id)
          EC2_INSTANCE_2_ID=$(terraform output -raw instance_2_id)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_PORT=$(terraform output -raw rds_port)

          echo "EC2_INSTANCE_ID=$EC2_INSTANCE_ID" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_2_ID=$EC2_INSTANCE_2_ID" >> "$GITHUB_ENV"
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> "$GITHUB_ENV"
          echo "RDS_PORT=$RDS_PORT" >> "$GITHUB_ENV"

          echo "App-1 instance ID received from Terraform."
          echo "App-2 instance ID received from Terraform."
          echo "RDS endpoint received from Terraform."
          echo "RDS port received from Terraform."

      # =====================================================
      # START BOTH EC2 INSTANCES
      # =====================================================

      - name: Check and start both EC2 instances
        run: |
          for INSTANCE_ID in "$EC2_INSTANCE_ID" "$EC2_INSTANCE_2_ID"; do

            EC2_STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text)

            echo "Instance $INSTANCE_ID state: $EC2_STATE"

            if [ "$EC2_STATE" = "stopped" ]; then
              echo "Starting $INSTANCE_ID..."
              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"

            elif [ "$EC2_STATE" = "running" ]; then
              echo "$INSTANCE_ID is already running."

            else
              echo "$INSTANCE_ID is currently in state: $EC2_STATE"
            fi

          done

      # =====================================================
      # WAIT FOR BOTH EC2 INSTANCES
      # =====================================================

      - name: Wait for both EC2 instances to be running
        run: |
          echo "Waiting for App-1 and App-2..."

          aws ec2 wait instance-running \
            --instance-ids \
            "$EC2_INSTANCE_ID" \
            "$EC2_INSTANCE_2_ID"

          echo "Both EC2 instances are running."

      - name: Wait for both EC2 status checks
        run: |
          echo "Waiting for EC2 status checks..."

          aws ec2 wait instance-status-ok \
            --instance-ids \
            "$EC2_INSTANCE_ID" \
            "$EC2_INSTANCE_2_ID"

          echo "Both EC2 instances passed status checks."

      # =====================================================
      # DISCOVER CURRENT PUBLIC IPS
      # =====================================================

      - name: Get current EC2 public IPs
        run: |
          EC2_PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          EC2_PUBLIC_IP_2=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_2_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "$EC2_PUBLIC_IP" ] || [ "$EC2_PUBLIC_IP" = "None" ]; then
            echo "ERROR: App-1 does not have a public IP."
            exit 1
          fi

          if [ -z "$EC2_PUBLIC_IP_2" ] || [ "$EC2_PUBLIC_IP_2" = "None" ]; then
            echo "ERROR: App-2 does not have a public IP."
            exit 1
          fi

          echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> "$GITHUB_ENV"
          echo "EC2_PUBLIC_IP_2=$EC2_PUBLIC_IP_2" >> "$GITHUB_ENV"

          echo "App-1 public IP: $EC2_PUBLIC_IP"
          echo "App-2 public IP: $EC2_PUBLIC_IP_2"

      # =====================================================
      # SSH
      # =====================================================

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ec2-key.pem
          chmod 600 ec2-key.pem

      # =====================================================
      # WAIT FOR DOCKER ON BOTH SERVERS
      # =====================================================

      - name: Wait for Docker on both EC2 instances
        run: |
          for SERVER_IP in "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2"; do

            echo "Waiting for SSH and Docker on $SERVER_IP..."

            READY=false

            for i in {1..30}; do

              if ssh \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=10 \
                -i ec2-key.pem \
                ubuntu@"$SERVER_IP" \
                "sudo docker info >/dev/null 2>&1"; then

                echo "Docker is ready on $SERVER_IP."
                READY=true
                break
              fi

              echo "Docker not ready on $SERVER_IP. Waiting 10 seconds..."
              sleep 10

            done

            if [ "$READY" != "true" ]; then
              echo "ERROR: Docker did not become ready on $SERVER_IP."
              exit 1
            fi

          done

      # =====================================================
      # BUILD AND PUSH IMAGE TO ECR
      # =====================================================

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            659364970665.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: |
          docker build \
            -t infra-deploy-aws-app \
            ./nodeapp

      - name: Tag Docker image
        run: |
          docker tag \
            infra-deploy-aws-app:latest \
            659364970665.dkr.ecr.ap-south-1.amazonaws.com/infra-deploy-aws-app:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            659364970665.dkr.ecr.ap-south-1.amazonaws.com/infra-deploy-aws-app:latest

      # =====================================================
      # LOGIN BOTH EC2 SERVERS TO ECR
      # =====================================================

      - name: Login to ECR on both EC2 instances
        run: |
          for SERVER_IP in "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2"; do

            echo "Logging $SERVER_IP into ECR..."

            aws ecr get-login-password --region ap-south-1 | \
            ssh \
              -o StrictHostKeyChecking=no \
              -i ec2-key.pem \
              ubuntu@"$SERVER_IP" \
              "sudo docker login \
              --username AWS \
              --password-stdin \
              659364970665.dkr.ecr.ap-south-1.amazonaws.com"

          done

      # =====================================================
      # DEPLOY APPLICATION TO BOTH SERVERS
      # =====================================================

      - name: Deploy application to both EC2 instances
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for SERVER_IP in "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2"; do

            echo "Deploying application to $SERVER_IP..."

            ssh \
              -o StrictHostKeyChecking=no \
              -i ec2-key.pem \
              ubuntu@"$SERVER_IP" \
              "sudo docker pull 659364970665.dkr.ecr.ap-south-1.amazonaws.com/infra-deploy-aws-app:latest && \
               sudo docker stop infra-deploy-aws-app || true; \
               sudo docker rm infra-deploy-aws-app || true; \
               sudo docker run \
                 -d \
                 --restart unless-stopped \
                 --name infra-deploy-aws-app \
                 -p 80:8080 \
                 -e DB_HOST='$RDS_ENDPOINT' \
                 -e DB_PORT='$RDS_PORT' \
                 -e DB_USER='adminuser' \
                 -e DB_PASSWORD='$DB_PASSWORD' \
                 -e DB_NAME='appdb' \
                 659364970665.dkr.ecr.ap-south-1.amazonaws.com/infra-deploy-aws-app:latest"

          done

      # =====================================================
      # VERIFY CONTAINERS
      # =====================================================

      - name: Verify containers on both EC2 instances
        run: |
          for SERVER_IP in "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2"; do

            echo "Checking container on $SERVER_IP..."

            ssh \
              -o StrictHostKeyChecking=no \
              -i ec2-key.pem \
              ubuntu@"$SERVER_IP" \
              "sudo docker ps --filter name=infra-deploy-aws-app"

          done

      # =====================================================
      # VERIFY APPLICATIONS
      # =====================================================

      - name: Verify application on both EC2 instances
        run: |
          for SERVER_IP in "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2"; do

            echo "Checking application at http://$SERVER_IP"

            SUCCESS=false

            for i in {1..12}; do

              if curl \
                --fail \
                --silent \
                --show-error \
                "http://$SERVER_IP" > /dev/null; then

                echo "Application verification successful on $SERVER_IP."
                SUCCESS=true
                break
              fi

              echo "Application not ready on $SERVER_IP. Waiting 5 seconds..."
              sleep 5

            done

            if [ "$SUCCESS" != "true" ]; then
              echo "ERROR: Application verification failed on $SERVER_IP."
              exit 1
            fi

          done

      # =====================================================
      # VERIFY RDS CONNECTION FROM BOTH SERVERS
      # =====================================================

      - name: Verify RDS connection from both EC2 instances
        run: |
          for SERVER_IP in "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2"; do

            echo "Checking RDS connection through $SERVER_IP..."

            SUCCESS=false

            for i in {1..12}; do

              if curl \
                --fail \
                --silent \
                --show-error \
                "http://$SERVER_IP/db"; then

                echo ""
                echo "RDS verification successful through $SERVER_IP."
                SUCCESS=true
                break
              fi

              echo "Database connection not ready on $SERVER_IP. Waiting 5 seconds..."
              sleep 5

            done

            if [ "$SUCCESS" != "true" ]; then

              echo "ERROR: RDS verification failed through $SERVER_IP."

              ssh \
                -o StrictHostKeyChecking=no \
                -i ec2-key.pem \
                ubuntu@"$SERVER_IP" \
                "sudo docker logs infra-deploy-aws-app"

              exit 1
            fi

          done

      # =====================================================
      # STOP BOTH EC2 INSTANCES ONLY AFTER SUCCESS
      # =====================================================

      - name: Stop both EC2 instances after successful deployment
        run: |
          echo "All deployment and verification steps completed successfully."

          echo "Stopping App-1: $EC2_INSTANCE_ID"
          echo "Stopping App-2: $EC2_INSTANCE_2_ID"

          aws ec2 stop-instances \
            --instance-ids \
            "$EC2_INSTANCE_ID" \
            "$EC2_INSTANCE_2_ID"

          echo "Stop requests sent successfully for both EC2 instances."