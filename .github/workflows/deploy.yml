name: CI/CD with Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_ami_id: ${{ vars.AWS_AMI_ID }}
      TF_VAR_key_name: ${{ vars.AWS_KEY_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Show EC2 public IP
        working-directory: terraform
        run: terraform output instance_public_ip

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 659364970665.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: docker build -t infra-deploy-aws-app ./nodeapp

      - name: Tag Docker image
        run: docker tag infra-deploy-aws-app:latest 659364970665.dkr.ecr.ap-south-1.amazonaws.com/infra-deploy-aws-app:latest

      - name: Push Docker image to ECR
        run: docker push 659364970665.dkr.ecr.ap-south-1.amazonaws.com/infra-deploy-aws-app:latest