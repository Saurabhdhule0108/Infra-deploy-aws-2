
name: CI/CD with Terraform and Ansible

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_ami_id: ${{ vars.AWS_AMI_ID }}
      TF_VAR_key_name: ${{ vars.AWS_KEY_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      AWS_REGION: ap-south-1
      RDS_IDENTIFIER: infra-deploy-aws-mysql
      ECR_REGISTRY: 659364970665.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: infra-deploy-aws-app

    steps:
      # =====================================================
      # CHECKOUT AND AWS AUTHENTICATION
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # =====================================================
      # TERRAFORM INITIALIZATION AND VALIDATION
      # =====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # =====================================================
      # CREATE SAVED TERRAFORM PLAN
      # =====================================================

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # =====================================================
      # PROTECT BOTH EXISTING EC2 INSTANCES
      # =====================================================

      - name: Verify Terraform plan does not replace EC2
        working-directory: terraform
        run: |
          terraform show -json tfplan > tfplan.json

          python3 - <<'PY'
          import json
          import sys

          with open("tfplan.json", encoding="utf-8") as file:
              plan = json.load(file)

          protected = {
              "aws_instance.app",
              "aws_instance.app_2",
          }

          violations = []

          for change in plan.get("resource_changes", []):
              address = change.get("address", "")
              resource_type = change.get("type", "")
              actions = change.get("change", {}).get("actions", [])

              if resource_type == "aws_instance":
                  if "delete" in actions:
                      violations.append((address, actions))

              if address in protected and "delete" in actions:
                  violations.append((address, actions))

          if violations:
              print("BLOCKED: EC2 destruction or replacement detected.")

              for address, actions in violations:
                  print(f"Resource: {address}")
                  print(f"Actions: {actions}")

              sys.exit(1)

          print("PASSED: No EC2 destruction or replacement.")
          print("Terraform apply is permitted.")
          PY

          rm -f tfplan.json

      # =====================================================
      # APPLY EXACTLY THE VERIFIED TERRAFORM PLAN
      # =====================================================

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # =====================================================
      # GET TERRAFORM OUTPUTS
      # =====================================================

      - name: Get Terraform outputs
        working-directory: terraform
        run: |
          EC2_INSTANCE_ID=$(terraform output -raw instance_id)
          EC2_INSTANCE_2_ID=$(terraform output -raw instance_2_id)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_PORT=$(terraform output -raw rds_port)

          echo "EC2_INSTANCE_ID=$EC2_INSTANCE_ID" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_2_ID=$EC2_INSTANCE_2_ID" >> "$GITHUB_ENV"
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> "$GITHUB_ENV"
          echo "RDS_PORT=$RDS_PORT" >> "$GITHUB_ENV"

          echo "App-1 ID: $EC2_INSTANCE_ID"
          echo "App-2 ID: $EC2_INSTANCE_2_ID"
          echo "RDS Endpoint: $RDS_ENDPOINT"

      # =====================================================
      # RDS LIFECYCLE
      # =====================================================

      - name: Check and start RDS if required
        run: |
          RDS_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_IDENTIFIER" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)

          echo "RDS state: $RDS_STATUS"

          if [ "$RDS_STATUS" = "stopped" ]; then
            aws rds start-db-instance \
              --db-instance-identifier "$RDS_IDENTIFIER"

          elif [ "$RDS_STATUS" = "stopping" ]; then
            aws rds wait db-instance-stopped \
              --db-instance-identifier "$RDS_IDENTIFIER"

            aws rds start-db-instance \
              --db-instance-identifier "$RDS_IDENTIFIER"
          fi

      - name: Wait for RDS to become available
        run: |
          aws rds wait db-instance-available \
            --db-instance-identifier "$RDS_IDENTIFIER"

          echo "RDS is available."

      # =====================================================
      # EC2 LIFECYCLE
      # =====================================================

      - name: Check and start both EC2 instances
        run: |
          for INSTANCE_ID in "$EC2_INSTANCE_ID" "$EC2_INSTANCE_2_ID"; do
            EC2_STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text)

            echo "$INSTANCE_ID state: $EC2_STATE"

            if [ "$EC2_STATE" = "stopped" ]; then
              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
            elif [ "$EC2_STATE" = "stopping" ]; then
              aws ec2 wait instance-stopped \
                --instance-ids "$INSTANCE_ID"

              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
            fi
          done

      - name: Wait for both EC2 instances
        run: |
          aws ec2 wait instance-running \
            --instance-ids "$EC2_INSTANCE_ID" "$EC2_INSTANCE_2_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$EC2_INSTANCE_ID" "$EC2_INSTANCE_2_ID"

          echo "Both EC2 instances are healthy."

      # =====================================================
      # GET CURRENT EC2 IP ADDRESSES
      # =====================================================

      - name: Get EC2 network information
        run: |
          EC2_PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          EC2_PRIVATE_IP=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)

          EC2_PUBLIC_IP_2=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_2_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          EC2_PRIVATE_IP_2=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_2_ID" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)

          for IP in "$EC2_PUBLIC_IP" "$EC2_PUBLIC_IP_2" "$EC2_PRIVATE_IP_2"; do
            if [ -z "$IP" ] || [ "$IP" = "None" ]; then
              echo "ERROR: Missing EC2 IP address."
              exit 1
            fi
          done

          echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> "$GITHUB_ENV"
          echo "EC2_PRIVATE_IP=$EC2_PRIVATE_IP" >> "$GITHUB_ENV"
          echo "EC2_PUBLIC_IP_2=$EC2_PUBLIC_IP_2" >> "$GITHUB_ENV"
          echo "EC2_PRIVATE_IP_2=$EC2_PRIVATE_IP_2" >> "$GITHUB_ENV"

          echo "App-1 public IP: $EC2_PUBLIC_IP"
          echo "App-2 public IP: $EC2_PUBLIC_IP_2"

      # =====================================================
      # BUILD AND PUSH DOCKER IMAGE
      # =====================================================

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REPOSITORY:latest" \
            ./nodeapp

      - name: Tag Docker image
        run: |
          docker tag \
            "$ECR_REPOSITORY:latest" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Push Docker image to ECR
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # =====================================================
      # PREPARE SECURE ANSIBLE SSH CONNECTION
      # =====================================================

      - name: Prepare SSH private key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Prepare verified SSH host keys
        env:
          APP1_SSH_HOST_KEY: ${{ vars.APP1_SSH_HOST_KEY }}
          APP2_SSH_HOST_KEY: ${{ vars.APP2_SSH_HOST_KEY }}
        run: |
          bash ansible/prepare-ssh.sh

      # =====================================================
      # INSTALL ANSIBLE AND GENERATE INVENTORY
      # =====================================================

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Generate Ansible inventory
        working-directory: ansible
        run: |
          bash generate-inventory.sh

      - name: Wait for Ansible SSH connectivity
        working-directory: ansible
        run: |
          READY=false

          for i in {1..30}; do
            if ansible app_servers \
              -i inventory.ini \
              -m ansible.builtin.ping \
              --private-key ../ec2-key.pem; then
              READY=true
              break
            fi

            echo "Waiting for EC2 SSH readiness..."
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: Ansible SSH connectivity failed."
            exit 1
          fi

      # =====================================================
      # ANSIBLE CONFIGURATION AND APPLICATION DEPLOYMENT
      # =====================================================

      - name: Configure and deploy using Ansible
        working-directory: ansible
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ansible-playbook \
            -i inventory.ini \
            ansible-deploy.yml \
            --private-key ../ec2-key.pem

      # =====================================================
      # PUBLIC APPLICATION VERIFICATION
      # =====================================================

      - name: Verify application through Nginx
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error \
              "http://$EC2_PUBLIC_IP" > /dev/null; then

              echo "Application verification successful."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "ERROR: Application verification failed."
          exit 1

      - name: Verify RDS connection through Nginx
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error \
              "http://$EC2_PUBLIC_IP/db"; then

              echo ""
              echo "RDS endpoint request successful."
              exit 0
            fi

            echo "Waiting for RDS connection..."
            sleep 5
          done

          echo "ERROR: RDS endpoint request failed."
          exit 1

      # =====================================================
      # STOP EC2 AFTER SUCCESSFUL DEPLOYMENT
      # =====================================================

      - name: Stop both EC2 instances after successful deployment
        run: |
          echo "Deployment completed successfully."

          aws ec2 stop-instances \
            --instance-ids \
            "$EC2_INSTANCE_ID" \
            "$EC2_INSTANCE_2_ID"

          echo "Both EC2 stop requests sent."
          echo "RDS remains running."
