
name: S3 to RDS Import

on:
  workflow_dispatch:
    inputs:
      csv_key:
        description: "CSV object key inside the S3 bucket"
        required: true
        default: "imports/users.csv"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  import-csv:
    name: Import S3 CSV into RDS MySQL
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      S3_BUCKET: infra-deploy-aws-2-app-data-2026
      CSV_KEY: ${{ inputs.csv_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Read App-1 instance ID from Terraform state
        id: instance
        shell: bash
        run: |
          terraform -chdir=terraform init -input=false

          APP_INSTANCE_ID=$(terraform -chdir=terraform output -raw instance_id)

          echo "app_instance_id=$APP_INSTANCE_ID" >> "$GITHUB_OUTPUT"

          echo "App-1 instance ID retrieved successfully."

      - name: Start App-1
        run: |
          aws ec2 start-instances \
            --instance-ids "${{ steps.instance.outputs.app_instance_id }}"

          aws ec2 wait instance-running \
            --instance-ids "${{ steps.instance.outputs.app_instance_id }}"

      - name: Prepare SSH connection
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          APP_INSTANCE_ID: ${{ steps.instance.outputs.app_instance_id }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          APP_IP=$(aws ec2 describe-instances \
            --instance-ids "$APP_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [ -z "$APP_IP" ] || [ "$APP_IP" = "None" ]; then
            echo "App-1 does not have a public IP address."
            exit 1
          fi

          echo "APP_IP=$APP_IP" >> "$GITHUB_ENV"

          ssh-keyscan -H "$APP_IP" >> ~/.ssh/known_hosts

      - name: Create CSV import script
        shell: bash
        run: |
          cat > s3-import.js <<'EOF'
          const fs = require('fs');
          const mysql = require('mysql2/promise');

          function parseCsvLine(line) {
            const values = [];
            let value = '';
            let quoted = false;

            for (let i = 0; i < line.length; i++) {
              const char = line[i];

              if (char === '"') {
                if (quoted && line[i + 1] === '"') {
                  value += '"';
                  i++;
                } else {
                  quoted = !quoted;
                }
              } else if (char === ',' && !quoted) {
                values.push(value.trim());
                value = '';
              } else {
                value += char;
              }
            }

            if (quoted) {
              throw new Error('Invalid CSV: unclosed quotation mark.');
            }

            values.push(value.trim());
            return values;
          }

          async function main() {
            const content = fs.readFileSync('/app/s3-import.csv', 'utf8')
              .replace(/^\uFEFF/, '')
              .trim();

            if (!content) {
              throw new Error('The CSV file is empty.');
            }

            const lines = content.split(/\r?\n/);
            const headers = parseCsvLine(lines.shift())
              .map(value => value.toLowerCase());

            const nameIndex = headers.indexOf('name');
            const emailIndex = headers.indexOf('email');

            if (nameIndex === -1 || emailIndex === -1) {
              throw new Error(
                'CSV must contain name,email columns. Do not include an ID column.'
              );
            }

            const records = lines
              .filter(line => line.trim() !== '')
              .map(line => {
                const values = parseCsvLine(line);
                return {
                  name: values[nameIndex],
                  email: values[emailIndex]
                };
              });

            if (records.length === 0) {
              throw new Error('The CSV contains no data rows.');
            }

            for (const record of records) {
              if (!record.name || !record.email ||
                  !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(record.email)) {
                throw new Error(
                  `Invalid name or email in CSV: ${JSON.stringify(record)}`
                );
              }
            }

            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT || 3306),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              connectTimeout: 15000
            });

            try {
              await connection.beginTransaction();

              for (const record of records) {
                await connection.execute(
                  `INSERT INTO users (name, email)
                   VALUES (?, ?)
                   ON DUPLICATE KEY UPDATE name = VALUES(name)`,
                  [record.name, record.email]
                );
              }

              await connection.commit();

              const [rows] = await connection.execute(
                `SELECT name, email FROM users
                 WHERE email IN (${records.map(() => '?').join(',')})
                 ORDER BY email`,
                records.map(record => record.email)
              );

              if (rows.length !== records.length) {
                throw new Error(
                  `Verification failed: expected ${records.length} records, found ${rows.length}.`
                );
              }

              console.log(`Import successful. Processed ${records.length} CSV records.`);
              console.log(`Database verification successful for ${rows.length} records.`);
            } catch (error) {
              await connection.rollback();
              throw error;
            } finally {
              await connection.end();
            }
          }

          main().catch(error => {
            console.error('Import failed:', error.message);
            process.exit(1);
          });
          EOF

      - name: Copy import script to App-1
        run: |
          scp -i ~/.ssh/ec2_key \
            s3-import.js \
            ubuntu@"$APP_IP":/tmp/s3-import.js

      - name: Download CSV from S3 and import into RDS
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@"$APP_IP" \
            "set -e
             aws s3 cp 's3://${S3_BUCKET}/${CSV_KEY}' /tmp/s3-import.csv
             docker cp /tmp/s3-import.csv infra-deploy-aws-app:/app/s3-import.csv
             docker cp /tmp/s3-import.js infra-deploy-aws-app:/app/s3-import.js
             docker exec -w /app infra-deploy-aws-app node /app/s3-import.js"

      - name: Stop App-1 to control EC2 costs
        if: always() && steps.instance.outputs.app_instance_id != ''
        run: |
          aws ec2 stop-instances \
            --instance-ids "${{ steps.instance.outputs.app_instance_id }}"
