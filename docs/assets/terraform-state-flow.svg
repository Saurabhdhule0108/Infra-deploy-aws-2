<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070B14"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<text x="600" y="52" text-anchor="middle" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#F0F6FC">TERRAFORM REMOTE STATE</text>
<text x="600" y="80" text-anchor="middle" font-family="Consolas" font-size="12" letter-spacing="2" fill="#A78BFA">CENTRAL STATE • S3 LOCKING • SAFE AUTOMATION</text>

<rect x="90" y="155" width="230" height="110" rx="15" fill="#111827" stroke="#58A6FF"/>
<text x="205" y="195" text-anchor="middle" font-family="Segoe UI" font-size="18" fill="#F0F6FC">GitHub Actions</text>
<text x="205" y="225" text-anchor="middle" font-family="Consolas" font-size="11" fill="#58A6FF">TERRAFORM RUN</text>

<rect x="485" y="135" width="230" height="150" rx="15" fill="#111827" stroke="#A78BFA"/>
<text x="600" y="180" text-anchor="middle" font-family="Segoe UI" font-size="19" fill="#F0F6FC">Terraform</text>
<text x="600" y="210" text-anchor="middle" font-family="Consolas" font-size="11" fill="#C4B5FD">READ / UPDATE STATE</text>
<text x="600" y="240" text-anchor="middle" font-family="Consolas" font-size="11" fill="#8B949E">COMPARE CONFIG + STATE + AWS</text>

<rect x="880" y="125" width="230" height="170" rx="15" fill="#111827" stroke="#3FB950"/>
<text x="995" y="170" text-anchor="middle" font-family="Segoe UI" font-size="19" fill="#F0F6FC">Amazon S3</text>
<text x="995" y="205" text-anchor="middle" font-family="Consolas" font-size="11" fill="#7EE787">terraform.tfstate</text>
<text x="995" y="235" text-anchor="middle" font-family="Consolas" font-size="11" fill="#E3B341">terraform.tfstate.tflock</text>
<text x="995" y="265" text-anchor="middle" font-family="Consolas" font-size="10" fill="#8B949E">REMOTE BACKEND</text>

<path d="M320 210H485" stroke="#58A6FF" stroke-width="2"/>
<path d="M715 210H880" stroke="#A78BFA" stroke-width="2"/>

<circle r="6" fill="#58A6FF" filter="url(#g)"><animateMotion path="M320 210H485" dur="2s" repeatCount="indefinite"/></circle>
<circle r="6" fill="#A78BFA" filter="url(#g)"><animateMotion path="M715 210H880" dur="2.2s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#3FB950" filter="url(#g)"><animateMotion path="M880 230H715" dur="2.5s" repeatCount="indefinite"/></circle>

<text x="600" y="355" text-anchor="middle" font-family="Consolas" font-size="12" fill="#8B949E">LOCKING PREVENTS TWO TERRAFORM OPERATIONS FROM CHANGING THE SAME STATE AT THE SAME TIME</text>
</svg>