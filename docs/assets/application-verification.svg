<svg width="1200" height="470" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="470" rx="22" fill="url(#bg)"/>

  <text x="600" y="48"
        text-anchor="middle"
        font-family="Segoe UI,Arial"
        font-size="27"
        font-weight="700"
        fill="#F0F6FC">
    APPLICATION VERIFICATION
  </text>

  <text x="600" y="76"
        text-anchor="middle"
        font-family="Consolas,monospace"
        font-size="12"
        letter-spacing="2"
        fill="#58A6FF">
    DEPLOY → TEST → DATABASE → HEALTHY
  </text>

  <!-- Deployment -->

  <rect x="60" y="175" width="170" height="90" rx="14"
        fill="#111827" stroke="#A78BFA"/>

  <text x="145" y="210"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="17"
        fill="#F0F6FC">
    Deployment
  </text>

  <text x="145" y="238"
        text-anchor="middle"
        font-family="Consolas"
        font-size="11"
        fill="#C4B5FD">
    COMPLETE
  </text>

  <!-- Verification -->

  <rect x="300" y="145" width="210" height="150" rx="14"
        fill="#111827" stroke="#58A6FF"/>

  <text x="405" y="185"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="18"
        fill="#F0F6FC">
    Verification
  </text>

  <text x="405" y="217"
        text-anchor="middle"
        font-family="Consolas"
        font-size="11"
        fill="#58A6FF">
    APP-1 :8080
  </text>

  <text x="405" y="242"
        text-anchor="middle"
        font-family="Consolas"
        font-size="11"
        fill="#58A6FF">
    APP-2 :8080
  </text>

  <text x="405" y="267"
        text-anchor="middle"
        font-family="Consolas"
        font-size="11"
        fill="#58A6FF">
    NGINX :80
  </text>

  <!-- DB -->

  <rect x="590" y="175" width="190" height="90" rx="14"
        fill="#111827" stroke="#3FB950"/>

  <text x="685" y="210"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="17"
        fill="#F0F6FC">
    /db
  </text>

  <text x="685" y="238"
        text-anchor="middle"
        font-family="Consolas"
        font-size="11"
        fill="#7EE787">
    RDS CONNECTION
  </text>

  <!-- Healthy -->

  <rect x="860" y="160" width="280" height="120" rx="16"
        fill="#111827" stroke="#3FB950"/>

  <circle cx="905" cy="220" r="10" fill="#3FB950" filter="url(#glow)">
    <animate attributeName="opacity"
             values="1;.35;1"
             dur="1.5s"
             repeatCount="indefinite"/>
  </circle>

  <text x="1005" y="208"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="18"
        font-weight="700"
        fill="#7EE787">
    HEALTHY
  </text>

  <text x="1005" y="238"
        text-anchor="middle"
        font-family="Consolas"
        font-size="11"
        fill="#8B949E">
    ALL CHECKS PASSED
  </text>

  <!-- Lines -->

  <path d="M230 220H300"
        stroke="#A78BFA"
        stroke-width="2"/>

  <path d="M510 220H590"
        stroke="#58A6FF"
        stroke-width="2"/>

  <path d="M780 220H860"
        stroke="#3FB950"
        stroke-width="2"/>

  <!-- Moving packets -->

  <circle r="6" fill="#A78BFA" filter="url(#glow)">
    <animateMotion path="M230 220H300"
                   dur="1.5s"
                   repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#58A6FF" filter="url(#glow)">
    <animateMotion path="M510 220H590"
                   dur="1.7s"
                   repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#3FB950" filter="url(#glow)">
    <animateMotion path="M780 220H860"
                   dur="1.8s"
                   repeatCount="indefinite"/>
  </circle>

  <text x="600" y="365"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="15"
        fill="#F0F6FC">
    Deployment is complete only after the application and database checks pass.
  </text>

  <text x="600" y="400"
        text-anchor="middle"
        font-family="Consolas"
        font-size="11"
        fill="#8B949E">
    APP-1 • APP-2 • PRIVATE CONNECTION • NGINX • DATABASE
  </text>
</svg>