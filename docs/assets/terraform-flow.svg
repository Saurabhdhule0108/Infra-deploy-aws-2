<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070B14"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#A78BFA"/></marker>
</defs>

<rect width="1200" height="430" rx="22" fill="url(#bg)"/>

<text x="600" y="52" text-anchor="middle" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#F0F6FC">TERRAFORM INFRASTRUCTURE FLOW</text>
<text x="600" y="80" text-anchor="middle" font-family="Consolas,monospace" font-size="12" letter-spacing="2" fill="#A78BFA">CONFIGURE • CHECK • PREVIEW • APPLY • PROVISION</text>

<g font-family="Segoe UI,Arial" text-anchor="middle">
  <g><rect x="55" y="160" width="170" height="90" rx="14" fill="#111827" stroke="#58A6FF"/><text x="140" y="195" font-size="16" fill="#F0F6FC">Terraform Files</text><text x="140" y="220" font-size="11" fill="#8B949E">HCL CONFIGURATION</text></g>
  <g><rect x="270" y="160" width="150" height="90" rx="14" fill="#111827" stroke="#A78BFA"/><text x="345" y="195" font-size="16" fill="#F0F6FC">init</text><text x="345" y="220" font-size="11" fill="#C4B5FD">INITIALIZE</text></g>
  <g><rect x="465" y="160" width="150" height="90" rx="14" fill="#111827" stroke="#A78BFA"/><text x="540" y="195" font-size="16" fill="#F0F6FC">validate</text><text x="540" y="220" font-size="11" fill="#C4B5FD">CHECK CONFIG</text></g>
  <g><rect x="660" y="160" width="150" height="90" rx="14" fill="#111827" stroke="#E3B341"/><text x="735" y="195" font-size="16" fill="#F0F6FC">plan</text><text x="735" y="220" font-size="11" fill="#E3B341">PREVIEW CHANGES</text></g>
  <g><rect x="855" y="160" width="150" height="90" rx="14" fill="#111827" stroke="#3FB950"/><text x="930" y="195" font-size="16" fill="#F0F6FC">apply</text><text x="930" y="220" font-size="11" fill="#7EE787">EXECUTE</text></g>
  <g><rect x="1050" y="160" width="110" height="90" rx="14" fill="#111827" stroke="#58A6FF"/><text x="1105" y="195" font-size="16" fill="#F0F6FC">AWS</text><text x="1105" y="220" font-size="11" fill="#58A6FF">RESOURCES</text></g>
</g>

<path d="M225 205H270M420 205H465M615 205H660M810 205H855M1005 205H1050" stroke="#A78BFA" stroke-width="2" fill="none" marker-end="url(#a)"/>

<circle r="6" fill="#A78BFA" filter="url(#g)">
 <animateMotion path="M225 205H270M420 205H465M615 205H660M810 205H855M1005 205H1050" dur="6s" repeatCount="indefinite"/>
</circle>

<text x="600" y="330" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#8B949E">DESIRED CONFIGURATION  →  TERRAFORM  →  AWS PROVIDER  →  AWS APIs</text>
<circle cx="455" cy="370" r="5" fill="#3FB950"><animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
<text x="600" y="375" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#7EE787">INFRASTRUCTURE MANAGED AS CODE</text>
</svg>