<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Infrastructure Deployment on AWS</title>
  <desc id="desc">
    Animated project banner for Infrastructure Deployment on AWS.
  </desc>

  <defs>
    <!-- Background -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>

    <!-- Neon gradients -->
    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#58A6FF"
            stroke-opacity="0.055"
            stroke-width="1"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Animated text masks -->
    <mask id="line1Mask">
      <rect x="150" y="205" width="0" height="45" fill="white">
        <animate
          attributeName="width"
          values="0;900;900;0;0"
          keyTimes="0;0.24;0.42;0.50;1"
          dur="12s"
          repeatCount="indefinite"/>
      </rect>
    </mask>

    <mask id="line2Mask">
      <rect x="150" y="205" width="0" height="45" fill="white">
        <animate
          attributeName="width"
          values="0;0;0;900;900;0"
          keyTimes="0;0.50;0.54;0.76;0.92;1"
          dur="12s"
          repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#background)"/>

  <!-- Grid -->
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>

  <!-- Animated center glow -->
  <circle cx="600" cy="195" r="220"
          fill="url(#centerGlow)"
          filter="url(#softGlow)">
    <animate
      attributeName="r"
      values="190;240;190"
      dur="7s"
      repeatCount="indefinite"/>
    <animate
      attributeName="opacity"
      values="0.65;1;0.65"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Decorative top line -->
  <line x1="120" y1="62" x2="1080" y2="62"
        stroke="#58A6FF"
        stroke-opacity="0.18"/>

  <!-- Moving packet - top -->
  <circle r="3.5" fill="#22D3EE" filter="url(#blueGlow)">
    <animateMotion
      path="M120 62 H1080"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Small status -->
  <circle cx="168" cy="99" r="5" fill="#3FB950">
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <text x="184" y="104"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        letter-spacing="2"
        fill="#8B949E">
    SYSTEM ONLINE
  </text>

  <text x="1030" y="104"
        text-anchor="end"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        letter-spacing="2"
        fill="#8B949E">
    AWS / AP-SOUTH-1
  </text>

  <!-- Main title -->
  <text x="600" y="158"
        text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="3"
        fill="#F0F6FC">
    INFRASTRUCTURE DEPLOYMENT
  </text>

  <text x="600" y="202"
        text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="31"
        font-weight="600"
        letter-spacing="12"
        fill="url(#neonBlue)"
        filter="url(#blueGlow)">
    ON AWS
  </text>

  <!-- Animated typing area -->
  <text x="600" y="245"
        text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="20"
        letter-spacing="1.5"
        fill="#58A6FF"
        mask="url(#line1Mask)">
    TERRAFORM • CI/CD • DOCKER • AWS • RESILIENCE
  </text>

  <text x="600" y="245"
        text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="20"
        letter-spacing="1.5"
        fill="#A78BFA"
        mask="url(#line2Mask)">
    BUILD • DEPLOY • FAILOVER • RECOVER • AUTOMATE
  </text>

  <!-- Animated cursor -->
  <rect x="150" y="222"
        width="10" height="28"
        rx="2"
        fill="#58A6FF"
        filter="url(#blueGlow)">

    <animate
      attributeName="x"
      values="150;1040;1040;150;150;1040;1040;150"
      keyTimes="0;0.24;0.42;0.50;0.54;0.76;0.92;1"
      dur="12s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="0.8s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Pipeline -->
  <g transform="translate(0 25)">

    <!-- Connection line -->
    <line x1="220" y1="285" x2="980" y2="285"
          stroke="#30363D"
          stroke-width="2"/>

    <!-- Animated line overlay -->
    <line x1="220" y1="285" x2="980" y2="285"
          stroke="url(#neonBlue)"
          stroke-width="2"
          stroke-dasharray="80 680">
      <animate
        attributeName="stroke-dashoffset"
        values="760;0"
        dur="4s"
        repeatCount="indefinite"/>
    </line>

    <!-- GitHub -->
    <g>
      <rect x="165" y="263"
            width="110" height="44"
            rx="10"
            fill="#111827"
            stroke="#30363D"/>

      <text x="220" y="290"
            text-anchor="middle"
            font-family="Inter, Segoe UI, Arial, sans-serif"
            font-size="13"
            fill="#F0F6FC">
        GITHUB
      </text>
    </g>

    <!-- OIDC -->
    <g>
      <rect x="315" y="263"
            width="110" height="44"
            rx="10"
            fill="#111827"
            stroke="#30363D"/>

      <text x="370" y="290"
            text-anchor="middle"
            font-family="Inter, Segoe UI, Arial, sans-serif"
            font-size="13"
            fill="#F0F6FC">
        OIDC / STS
      </text>
    </g>

    <!-- Terraform -->
    <g>
      <rect x="465" y="263"
            width="120" height="44"
            rx="10"
            fill="#111827"
            stroke="#7C3AED"
            stroke-opacity="0.7"/>

      <text x="525" y="290"
            text-anchor="middle"
            font-family="Inter, Segoe UI, Arial, sans-serif"
            font-size="13"
            fill="#C4B5FD">
        TERRAFORM
      </text>
    </g>

    <!-- AWS -->
    <g>
      <rect x="625" y="263"
            width="110" height="44"
            rx="10"
            fill="#111827"
            stroke="#58A6FF"
            stroke-opacity="0.7"/>

      <text x="680" y="290"
            text-anchor="middle"
            font-family="Inter, Segoe UI, Arial, sans-serif"
            font-size="13"
            fill="#58A6FF">
        AWS
      </text>
    </g>

    <!-- Docker -->
    <g>
      <rect x="775" y="263"
            width="110" height="44"
            rx="10"
            fill="#111827"
            stroke="#22D3EE"
            stroke-opacity="0.7"/>

      <text x="830" y="290"
            text-anchor="middle"
            font-family="Inter, Segoe UI, Arial, sans-serif"
            font-size="13"
            fill="#67E8F9">
        DOCKER
      </text>
    </g>

    <!-- Healthy -->
    <g>
      <rect x="925" y="263"
            width="110" height="44"
            rx="10"
            fill="#111827"
            stroke="#3FB950"
            stroke-opacity="0.7"/>

      <circle cx="949" cy="285" r="5" fill="#3FB950">
        <animate
          attributeName="r"
          values="4;7;4"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>

      <text x="989" y="290"
            text-anchor="middle"
            font-family="Inter, Segoe UI, Arial, sans-serif"
            font-size="13"
            fill="#7EE787">
        HEALTHY
      </text>
    </g>

    <!-- Moving deployment packet -->
    <circle r="5"
            fill="#58A6FF"
            filter="url(#blueGlow)">
      <animateMotion
        path="M220 285 H980"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Bottom labels -->
  <text x="160" y="384"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="11"
        letter-spacing="1"
        fill="#484F58">
    INFRASTRUCTURE AS CODE
  </text>

  <text x="600" y="384"
        text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="11"
        letter-spacing="1"
        fill="#484F58">
    AUTOMATED CLOUD DELIVERY
  </text>

  <text x="1040" y="384"
        text-anchor="end"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="11"
        letter-spacing="1"
        fill="#484F58">
    ACTIVE-PASSIVE RESILIENCE
  </text>

  <!-- Border -->
  <rect x="1" y="1"
        width="1198" height="418"
        rx="23"
        fill="none"
        stroke="url(#neonPurple)"
        stroke-opacity="0.30"
        stroke-width="2"/>

</svg>