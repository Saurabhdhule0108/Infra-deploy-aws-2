<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#22D3EE"/>
    </marker>

  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>

  <text x="600" y="55"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="27"
        font-weight="700"
        fill="#F0F6FC">
    CONTAINER DELIVERY PIPELINE
  </text>

  <text x="600" y="84"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="12"
        letter-spacing="2"
        fill="#22D3EE">
    BUILD ONCE • STORE ONCE • DEPLOY CONSISTENTLY
  </text>

  <!-- Source -->
  <rect x="70" y="160" width="180" height="95" rx="15"
        fill="#111827" stroke="#58A6FF"/>

  <text x="160" y="197"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="17"
        font-weight="700"
        fill="#F0F6FC">
    Node.js
  </text>

  <text x="160" y="225"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="11"
        fill="#8B949E">
    SOURCE CODE
  </text>

  <!-- Build -->
  <rect x="320" y="160" width="180" height="95" rx="15"
        fill="#111827" stroke="#22D3EE"/>

  <text x="410" y="197"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="17"
        font-weight="700"
        fill="#F0F6FC">
    Docker Build
  </text>

  <text x="410" y="225"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="11"
        fill="#67E8F9">
    IMAGE
  </text>

  <!-- ECR -->
  <rect x="570" y="160" width="180" height="95" rx="15"
        fill="#111827" stroke="#22D3EE"/>

  <text x="660" y="197"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="17"
        font-weight="700"
        fill="#F0F6FC">
    Amazon ECR
  </text>

  <text x="660" y="225"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="11"
        fill="#67E8F9">
    IMAGE REGISTRY
  </text>

  <!-- App1 -->
  <rect x="840" y="115" width="250" height="95" rx="15"
        fill="#111827" stroke="#3FB950"/>

  <text x="965" y="153"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="17"
        font-weight="700"
        fill="#F0F6FC">
    EC2 App-1
  </text>

  <text x="965" y="181"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="11"
        fill="#7EE787">
    PRIMARY • NODE :8080
  </text>

  <!-- App2 -->
  <rect x="840" y="245" width="250" height="95" rx="15"
        fill="#111827" stroke="#E3B341"/>

  <text x="965" y="283"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="17"
        font-weight="700"
        fill="#F0F6FC">
    EC2 App-2
  </text>

  <text x="965" y="311"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="11"
        fill="#E3B341">
    BACKUP • NODE :8080
  </text>

  <!-- lines -->
  <path d="M250 207H320"
        stroke="#22D3EE"
        stroke-width="2"
        fill="none"
        marker-end="url(#arrow)"/>

  <path d="M500 207H570"
        stroke="#22D3EE"
        stroke-width="2"
        fill="none"
        marker-end="url(#arrow)"/>

  <path d="M750 190 C790 190 800 162 840 162"
        stroke="#22D3EE"
        stroke-width="2"
        fill="none"
        marker-end="url(#arrow)"/>

  <path d="M750 225 C790 225 800 292 840 292"
        stroke="#22D3EE"
        stroke-width="2"
        fill="none"
        marker-end="url(#arrow)"/>

  <!-- packets -->
  <circle r="6" fill="#22D3EE" filter="url(#glow)">
    <animateMotion path="M250 207H320"
                   dur="1.6s"
                   repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#22D3EE" filter="url(#glow)">
    <animateMotion path="M500 207H570"
                   dur="1.8s"
                   repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#3FB950" filter="url(#glow)">
    <animateMotion
      path="M750 190 C790 190 800 162 840 162"
      dur="2.1s"
      repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#E3B341" filter="url(#glow)">
    <animateMotion
      path="M750 225 C790 225 800 292 840 292"
      dur="2.4s"
      repeatCount="indefinite"/>
  </circle>

  <text x="600" y="385"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="11"
        letter-spacing="1.5"
        fill="#8B949E">
    SAME APPLICATION IMAGE • SAME RUNTIME • TWO APPLICATION SERVERS
  </text>

</svg>