<text x="775" y="360" text-anchor="middle" font-family="Consolas" font-size="11" fill="#E3B341">BACKUP • PRIVATE IP:8080</text>

<path d="M230 232H310" stroke="#58A6FF" stroke-width="2"/>
<path d="M500 210C560 210 590 155 650 155" stroke="#3FB950" stroke-width="3"/>
