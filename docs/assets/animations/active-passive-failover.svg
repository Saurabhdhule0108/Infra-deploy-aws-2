
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Active-Passive Failover Test</title>
  <desc id="desc">Animated demonstration of requests flowing through Nginx on App-1 to the primary application, switching to App-2 when the primary container fails, and returning to App-1 after recovery. Both applications use the same private RDS MySQL database.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162840"/>
      <stop offset="100%" stop-color="#111b2b"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15382f"/>
      <stop offset="100%" stop-color="#10251f"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2028"/>
      <stop offset="100%" stop-color="#211720"/>
    </linearGradient>
    <linearGradient id="goldCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a301d"/>
      <stop offset="100%" stop-color="#211e18"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#58a6ff"/>
    </marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#3fb950"/>
    </marker>
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#e3b341"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .heading { fill:#f0f6fc; font-size:25px; font-weight:750; letter-spacing:.5px; }
      .subtitle { fill:#8badd4; font-family:Consolas,monospace; font-size:11px; letter-spacing:1.6px; }
      .name { fill:#f0f6fc; font-size:17px; font-weight:700; }
      .detail { fill:#a9bacd; font-family:Consolas,monospace; font-size:10px; }
      .label { fill:#d7e2ef; font-size:11px; font-weight:600; }
      .route { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .packet { filter:url(#glow); }
      .primaryPath { animation: primaryRoute 10s ease-in-out infinite; }
      .backupPath { animation: backupRoute 10s ease-in-out infinite; }
      .primaryNode { animation: primaryState 10s ease-in-out infinite; }
      .backupNode { animation: backupState 10s ease-in-out infinite; }
      .primaryText { animation: primaryTextState 10s ease-in-out infinite; }
      .backupText { animation: backupTextState 10s ease-in-out infinite; }
      .primaryPacket { animation: primaryPacketState 10s ease-in-out infinite; }
      .backupPacket { animation: backupPacketState 10s ease-in-out infinite; }
      .status1 { animation: statusOne 10s ease-in-out infinite; }
      .status2 { animation: statusTwo 10s ease-in-out infinite; }
      .status3 { animation: statusThree 10s ease-in-out infinite; }
      .status4 { animation: statusFour 10s ease-in-out infinite; }
      @keyframes primaryRoute {
        0%,30%,76%,100% { opacity:1; }
        36%,70% { opacity:.12; }
      }
      @keyframes backupRoute {
        0%,30%,76%,100% { opacity:.18; }
        36%,70% { opacity:1; }
      }
      @keyframes primaryState {
        0%,30%,76%,100% { fill:url(#greenCard); stroke:#3fb950; }
        36%,70% { fill:url(#redCard); stroke:#f85149; }
      }
      @keyframes backupState {
        0%,30%,76%,100% { fill:url(#goldCard); stroke:#e3b341; }
        36%,70% { fill:url(#greenCard); stroke:#3fb950; }
      }
      @keyframes primaryTextState {
        0%,30%,76%,100% { fill:#7ee787; }
        36%,70% { fill:#ff7b72; }
      }
      @keyframes backupTextState {
        0%,30%,76%,100% { fill:#e3b341; }
        36%,70% { fill:#7ee787; }
      }
      @keyframes primaryPacketState {
        0%,30%,76%,100% { opacity:1; }
        36%,70% { opacity:0; }
      }
      @keyframes backupPacketState {
        0%,30%,76%,100% { opacity:0; }
        36%,70% { opacity:1; }
      }
      @keyframes statusOne {
        0%,30%,76%,100% { opacity:1; }
        31%,75% { opacity:.3; }
      }
      @keyframes statusTwo {
        0%,30%,76%,100% { opacity:.35; }
        36%,70% { opacity:1; }
      }
      @keyframes statusThree {
        0%,70% { opacity:.35; }
        76%,100% { opacity:1; }
      }
      @keyframes statusFour {
        0%,70% { opacity:.35; }
        76%,100% { opacity:1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .primaryPath,.backupPath,.primaryNode,.backupNode,
        .primaryText,.backupText,.primaryPacket,.backupPacket,
        .status1,.status2,.status3,.status4 { animation:none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="498" rx="21" fill="none" stroke="#26364b"/>

  <!-- Heading -->
  <text x="600" y="43" text-anchor="middle" class="heading">ACTIVE–PASSIVE FAILOVER</text>
  <text x="600" y="67" text-anchor="middle" class="subtitle">DETECT FAILURE · SWITCH ROUTE · RESTORE PRIMARY</text>
  <rect x="451" y="82" width="298" height="27" rx="13.5" fill="#142438" stroke="#304763"/>
  <circle cx="468" cy="95.5" r="4" fill="#58a6ff"/>
  <text x="482" y="99" fill="#b9d8ff" font-size="10.5" font-weight="650">GITHUB ACTIONS · MANUAL TEST</text>

  <!-- User -->
  <rect x="43" y="190" width="155" height="91" rx="15" fill="url(#blueCard)" stroke="#3c72a8" stroke-width="1.5"/>
  <circle cx="120" cy="211" r="5" fill="#58a6ff"/>
  <text x="120" y="237" text-anchor="middle" class="name">User</text>
  <text x="120" y="258" text-anchor="middle" class="detail">PUBLIC URL</text>

  <!-- Nginx -->
  <rect x="260" y="190" width="180" height="91" rx="15" fill="url(#blueCard)" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="278" y="207" width="23" height="23" rx="5" fill="#1e3d60" stroke="#58a6ff"/>
  <path d="M283 213 H296 M283 218 H296 M283 223 H292" stroke="#a9d5ff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="350" y="225" text-anchor="middle" class="name">Nginx</text>
  <text x="350" y="248" text-anchor="middle" fill="#8dc5ff" class="detail">REVERSE PROXY</text>
  <text x="350" y="265" text-anchor="middle" class="detail">ON APP-1 · :80</text>

  <!-- User to Nginx -->
  <path d="M198 235 H258" class="route" stroke="#58a6ff" marker-end="url(#blueArrow)"/>
  <circle r="4.5" fill="#8dc5ff" class="packet">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M198 235 H253"/>
  </circle>

  <!-- Primary app node -->
  <rect x="515" y="140" width="230" height="105" rx="15" class="primaryNode" stroke-width="1.8"/>
  <text x="630" y="169" text-anchor="middle" class="name">EC2 · App-1</text>
  <text x="630" y="191" text-anchor="middle" class="detail">DOCKER APP · :8080</text>
  <rect x="564" y="204" width="132" height="24" rx="12" fill="#0b151f" stroke="#35495d"/>
  <text x="630" y="220" text-anchor="middle" class="label primaryText">PRIMARY</text>

  <!-- Backup app node -->
  <rect x="515" y="310" width="230" height="105" rx="15" class="backupNode" stroke-width="1.8"/>
  <text x="630" y="339" text-anchor="middle" class="name">EC2 · App-2</text>
  <text x="630" y="361" text-anchor="middle" class="detail">DOCKER APP · :8080</text>
  <rect x="564" y="374" width="132" height="24" rx="12" fill="#0b151f" stroke="#35495d"/>
  <text x="630" y="390" text-anchor="middle" class="label backupText">PASSIVE</text>

  <!-- Nginx to primary route -->
  <path d="M440 215 C472 215 478 187 513 187" class="route primaryPath" stroke="#3fb950" marker-end="url(#greenArrow)"/>
  <circle r="5" fill="#7ee787" class="packet primaryPacket">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M440 215 C472 215 478 187 509 187"/>
  </circle>

  <!-- Nginx to backup route -->
  <path d="M440 254 C470 254 477 362 513 362" class="route backupPath" stroke="#e3b341" stroke-dasharray="7 6" marker-end="url(#goldArrow)"/>
  <circle r="5" fill="#e3b341" class="packet backupPacket">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M440 254 C470 254 477 362 509 362"/>
  </circle>

  <!-- Shared database connections -->
  <path d="M745 184 C804 184 817 230 867 230" class="route" stroke="#3fb950" opacity=".9"/>
  <path d="M745 363 C804 363 817 265 867 265" class="route" stroke="#3fb950" opacity=".9"/>

  <circle r="4" fill="#7ee787" class="packet">
    <animateMotion dur="2s" repeatCount="indefinite" path="M745 184 C804 184 817 230 867 230"/>
  </circle>
  <circle r="4" fill="#7ee787" class="packet">
    <animateMotion dur="2s" repeatCount="indefinite" path="M745 363 C804 363 817 265 867 265"/>
  </circle>

  <!-- Shared RDS -->
  <rect x="870" y="190" width="282" height="111" rx="15" fill="url(#greenCard)" stroke="#2d9b72" stroke-width="1.5"/>
  <g transform="translate(889 207)" fill="none" stroke="#7ee787" stroke-width="1.7">
    <ellipse cx="13" cy="5" rx="13" ry="5"/>
    <path d="M0 5 V26 C0 33 26 33 26 26 V5 M0 15 C0 22 26 22 26 15"/>
  </g>
  <text x="1006" y="225" text-anchor="middle" class="name">RDS MySQL</text>
  <text x="1006" y="248" text-anchor="middle" fill="#7ee787" class="detail">PRIVATE DATABASE · :3306</text>
  <text x="1006" y="273" text-anchor="middle" class="detail">SHARED BY BOTH APPS</text>

  <!-- Live status -->
  <rect x="870" y="318" width="282" height="96" rx="13" fill="#111d2b" stroke="#34465c"/>
  <text x="888" y="341" fill="#a9bacd" font-size="10" font-weight="700" letter-spacing="1">LIVE ROUTING STATE</text>
  <circle cx="891" cy="360" r="4" fill="#3fb950"/>
  <text x="903" y="364" fill="#7ee787" font-size="11" class="status1">App-1 serving requests</text>
  <circle cx="891" cy="382" r="4" fill="#f85149"/>
  <text x="903" y="386" fill="#ff7b72" font-size="11" class="status2">App-1 app failure simulated</text>
  <circle cx="891" cy="402" r="4" fill="#3fb950"/>
  <text x="903" y="406" fill="#7ee787" font-size="11" class="status3">App-1 restored and verified</text>

  <!-- Timeline -->
  <text x="600" y="448" text-anchor="middle" fill="#8296af" font-family="Consolas,monospace" font-size="11" letter-spacing="1">
    PRIMARY ACTIVE  →  APP FAILURE  →  BACKUP ROUTE  →  PRIMARY RESTORED
  </text>

  <!-- Timeline progress -->
  <rect x="255" y="463" width="690" height="4" rx="2" fill="#1e2b3d"/>
  <rect x="255" y="463" width="690" height="4" rx="2" fill="#58a6ff" opacity=".9">
    <animate attributeName="width" values="0;690;0" dur="10s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="486" text-anchor="middle" fill="#71839b" font-size="10">
    SAME URL · SAME DATABASE · ROUTE CHANGES WHEN THE PRIMARY APP FAILS
  </text>
</svg>
