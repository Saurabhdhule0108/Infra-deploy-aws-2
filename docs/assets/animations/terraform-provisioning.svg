
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Terraform Infrastructure Workflow</title>
  <desc id="desc">Four Terraform commands: init, validate, plan, and apply, followed by AWS infrastructure provisioning and remote state storage.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091525"/>
      <stop offset="100%" stop-color="#132641"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#60c9fa"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#edf5ff}
      .title{font-size:25px;font-weight:700}
      .muted{font-size:14px;fill:#a9bfd9}
      .cmd{font-size:19px;font-weight:700;fill:#7dd3fc}
      .desc{font-size:14px;fill:#d1dfef}
      .box{fill:#122943;stroke:#3e6287;stroke-width:1.5}
      .line{fill:none;stroke:#60c9fa;stroke-width:2.5;marker-end:url(#arrow);stroke-dasharray:7 6;animation:flow 1.4s linear infinite}
      .step{font-size:12px;fill:#a9bfd9;font-weight:700;letter-spacing:1px}
      @keyframes flow{to{stroke-dashoffset:-26}}
      @media(prefers-reduced-motion:reduce){.line{animation:none}}
    </style>
  </defs>

  <rect width="1000" height="430" rx="20" fill="url(#bg)"/>

  <text x="32" y="43" class="title">TERRAFORM WORKFLOW</text>
  <text x="32" y="69" class="muted">Four essential commands • Infrastructure as Code (IaC)</text>

  <!-- Four commands -->
  <rect x="32" y="105" width="216" height="116" rx="13" class="box"/>
  <text x="49" y="130" class="step">01 · INITIALIZE</text>
  <text x="49" y="159" class="cmd">terraform init</text>
  <text x="49" y="185" class="desc">Downloads providers</text>
  <text x="49" y="204" class="desc">Prepares backend</text>

  <path d="M249 164 H266" class="line"/>

  <rect x="270" y="105" width="216" height="116" rx="13" class="box"/>
  <text x="287" y="130" class="step">02 · VALIDATE</text>
  <text x="287" y="159" class="cmd">terraform validate</text>
  <text x="287" y="185" class="desc">Checks configuration</text>
  <text x="287" y="204" class="desc">Finds syntax errors</text>

  <path d="M487 164 H504" class="line"/>

  <rect x="508" y="105" width="216" height="116" rx="13" class="box"/>
  <text x="525" y="130" class="step">03 · PREVIEW</text>
  <text x="525" y="159" class="cmd">terraform plan</text>
  <text x="525" y="185" class="desc">Shows proposed changes</text>
  <text x="525" y="204" class="desc">Before applying</text>

  <path d="M725 164 H742" class="line"/>

  <rect x="746" y="105" width="222" height="116" rx="13" fill="#12342f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="763" y="130" class="step">04 · EXECUTE</text>
  <text x="763" y="159" class="cmd" fill="#86efac">terraform apply</text>
  <text x="763" y="185" class="desc">Creates / updates</text>
  <text x="763" y="204" class="desc">AWS resources</text>

  <!-- Outputs -->
  <path d="M857 222 V258 H500 V279" class="line"/>

  <rect x="250" y="284" width="500" height="61" rx="12" fill="#102c43" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="308" text-anchor="middle" font-size="18" font-weight="700">AWS Infrastructure</text>
  <text x="500" y="330" text-anchor="middle" class="desc">VPC • EC2 • RDS • Security Groups • IAM</text>

  <rect x="32" y="365" width="936" height="43" rx="10" fill="#0b1b2e" stroke="#344c68"/>
  <text x="50" y="391" font-size="14" font-weight="700" fill="#7dd3fc">REMOTE STATE</text>
  <text x="174" y="391" class="desc">S3 stores Terraform state</text>
  <text x="475" y="391" class="desc">use_lockfile = true helps prevent concurrent state operations</text>
</svg>
