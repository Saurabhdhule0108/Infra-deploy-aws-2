
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions CI/CD and Automation Workflows</title>
  <desc id="desc">One automatic deployment workflow triggered by a push to main and three independent manually triggered workflows for failover testing, S3 import, and S3 export, each showing its outcome.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F1D"/>
      <stop offset="100%" stop-color="#12243B"/>
    </linearGradient>
    <linearGradient id="autoFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153B35"/>
      <stop offset="100%" stop-color="#102B2A"/>
    </linearGradient>
    <linearGradient id="manualFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#193552"/>
      <stop offset="100%" stop-color="#14283E"/>
    </linearGradient>
    <linearGradient id="resultFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2C43"/>
      <stop offset="100%" stop-color="#142237"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".22"/>
    </filter>

    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#60C9FA"/>
    </marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#4ADE80"/>
    </marker>
    <marker id="yellowArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#F5C451"/>
    </marker>
    <marker id="purpleArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#C4A7FF"/>
    </marker>

    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill:#EDF5FF; }
      .heading { font-size:24px; font-weight:750; }
      .subtitle { font-size:12px; fill:#A9BED5; }
      .label { font-size:14px; font-weight:700; }
      .body { font-size:11px; fill:#CFDCEC; }
      .small { font-size:10px; fill:#A8BCD2; }
      .mono { font-family:Consolas, monospace; font-size:10px; }
      .source { fill:#1A2A41; stroke:#6D8BAE; stroke-width:1.4; }
      .auto { fill:url(#autoFill); stroke:#4ADE80; stroke-width:1.4; }
      .manual { fill:url(#manualFill); stroke:#60A5FA; stroke-width:1.3; }
      .result { fill:url(#resultFill); stroke:#45617F; stroke-width:1.2; }
      .line { fill:none; stroke:#60C9FA; stroke-width:2; marker-end:url(#blueArrow); }
      .greenLine { fill:none; stroke:#4ADE80; stroke-width:2; marker-end:url(#greenArrow); }
      .yellowLine { fill:none; stroke:#F5C451; stroke-width:2; marker-end:url(#yellowArrow); }
      .purpleLine { fill:none; stroke:#C4A7FF; stroke-width:2; marker-end:url(#purpleArrow); }
      .flow { stroke-dasharray:6 6; animation:flow 1.5s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-24; } }
      @media (prefers-reduced-motion:reduce) { .flow { animation:none; } }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="650" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="648" rx="21" fill="none" stroke="#293D56"/>

  <!-- Header -->
  <text x="30" y="42" class="heading">GITHUB ACTIONS · FOUR WORKFLOWS</text>
  <text x="30" y="65" class="subtitle">Push to deploy · Manual trigger to test or move data · Every workflow has its own result</text>

  <rect x="810" y="25" width="258" height="34" rx="17" fill="#162B41" stroke="#385675"/>
  <circle cx="830" cy="42" r="4" fill="#4ADE80"/>
  <text x="843" y="46" font-size="11" font-weight="700">AUTOMATE · VERIFY · DELIVER</text>

  <!-- Repository source -->
  <rect x="30" y="91" width="190" height="76" rx="12" class="source" filter="url(#shadow)"/>
  <text x="125" y="116" text-anchor="middle" class="label">GitHub Repository</text>
  <text x="125" y="137" text-anchor="middle" class="body">Push to main</text>
  <text x="125" y="153" text-anchor="middle" class="small">or select Run workflow</text>

  <!-- Trigger connector and split -->
  <path d="M220 129 H242 V110 H264" class="greenLine flow"/>
  <path d="M242 129 V381 H264" class="line flow"/>

  <text x="264" y="88" fill="#86EFAC" font-size="11" font-weight="750">01 · AUTOMATIC DEPLOYMENT</text>

  <!-- Deploy workflow -->
  <rect x="264" y="98" width="305" height="104" rx="12" class="auto" filter="url(#shadow)"/>
  <rect x="264" y="98" width="5" height="104" rx="2" fill="#4ADE80"/>
  <text x="282" y="122" class="label">deploy.yml</text>
  <rect x="463" y="107" width="91" height="20" rx="10" fill="#214D3D"/>
  <text x="508" y="121" text-anchor="middle" fill="#A7F3C0" font-size="9" font-weight="700">ON PUSH</text>
  <text x="282" y="146" class="body">Terraform → provision infrastructure</text>
  <text x="282" y="164" class="body">Docker → build and push image to ECR</text>
  <text x="282" y="182" class="body">Ansible → configure · deploy · verify</text>

  <!-- Deployment output path -->
  <path d="M569 150 H595" class="greenLine flow"/>
  <rect x="601" y="98" width="467" height="104" rx="12" class="result" filter="url(#shadow)"/>
  <text x="619" y="121" class="label">Deployment results</text>

  <!-- ECR icon -->
  <rect x="619" y="135" width="131" height="51" rx="8" fill="#172D43" stroke="#52789B"/>
  <path d="M631 150 L641 145 L651 150 L651 162 L641 167 L631 162 Z" fill="none" stroke="#60C9FA" stroke-width="1.4"/>
  <text x="660" y="154" font-size="11" font-weight="700">Amazon ECR</text>
  <text x="660" y="171" class="small">Image stored</text>

  <!-- EC2 icon -->
  <rect x="760" y="135" width="145" height="51" rx="8" fill="#172D43" stroke="#52789B"/>
  <rect x="773" y="147" width="19" height="17" rx="3" fill="none" stroke="#8DBEFF" stroke-width="1.4"/>
  <path d="M777 152 H788 M777 157 H788 M777 168 H788" stroke="#8DBEFF" stroke-width="1.2"/>
  <text x="800" y="154" font-size="11" font-weight="700">EC2 App-1 / 2</text>
  <text x="800" y="171" class="small">App deployed</text>

  <!-- Checks icon -->
  <rect x="915" y="135" width="135" height="51" rx="8" fill="#172D43" stroke="#52789B"/>
  <circle cx="931" cy="155" r="8" fill="#214D3D" stroke="#4ADE80"/>
  <path d="M927 155 L930 158 L936 151" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="944" y="154" font-size="11" font-weight="700">Verification</text>
  <text x="944" y="171" class="small">Health + DB</text>

  <!-- Manual workflows heading -->
  <text x="264" y="239" fill="#8DCBFF" font-size="11" font-weight="750">02 · MANUAL WORKFLOWS</text>
  <text x="1068" y="239" text-anchor="end" class="small">Select and run each workflow separately</text>

  <!-- Manual 1: failover -->
  <rect x="264" y="250" width="305" height="77" rx="11" class="manual" filter="url(#shadow)"/>
  <rect x="264" y="250" width="5" height="77" rx="2" fill="#60A5FA"/>
  <text x="282" y="273" class="label">failover-test.yml</text>
  <text x="282" y="293" class="body">Test App-1 failure and App-2 fallback</text>
  <text x="282" y="311" class="small">Verify traffic routing and recovery</text>

  <!-- Failover arrow -->
  <path d="M569 288 H595" class="line flow"/>
  <rect x="601" y="250" width="467" height="77" rx="11" class="result"/>
  <circle cx="625" cy="275" r="10" fill="#193C32" stroke="#4ADE80"/>
  <path d="M620 275 L624 279 L631 270" fill="none" stroke="#4ADE80" stroke-width="1.8"/>
  <text x="646" y="276" class="label">Application failover verified</text>
  <text x="619" y="301" class="body">App-2 serves requests during the App-1 container test</text>
  <text x="619" y="316" class="small">Shared RDS MySQL remains the database</text>

  <!-- Manual 2: import -->
  <rect x="264" y="339" width="305" height="77" rx="11" class="manual" filter="url(#shadow)"/>
  <rect x="264" y="339" width="5" height="77" rx="2" fill="#60A5FA"/>
  <text x="282" y="362" class="label">s3-import.yml</text>
  <text x="282" y="382" class="body">S3 CSV → EC2 → RDS MySQL</text>
  <text x="282" y="400" class="small">Validate and import user records</text>

  <!-- Import arrow -->
  <path d="M569 377 H595" class="yellowLine flow"/>
  <rect x="601" y="339" width="467" height="77" rx="11" class="result"/>
  <path d="M619 356 H635 V377 H619 Z M623 352 H631 V356" fill="none" stroke="#F5C451" stroke-width="1.5"/>
  <text x="646" y="363" class="label">User records saved in RDS</text>
  <text x="619" y="389" class="body">CSV is read from S3 and its records are imported</text>
  <text x="619" y="405" class="small">MySQL appdb · users table</text>

  <!-- Manual 3: export -->
  <rect x="264" y="428" width="305" height="77" rx="11" class="manual" filter="url(#shadow)"/>
  <rect x="264" y="428" width="5" height="77" rx="2" fill="#60A5FA"/>
  <text x="282" y="451" class="label">s3-export.yml</text>
  <text x="282" y="471" class="body">RDS MySQL → EC2 → S3 CSV</text>
  <text x="282" y="489" class="small">Query records and create an export file</text>

  <!-- Export arrow -->
  <path d="M569 466 H595" class="purpleLine flow"/>
  <rect x="601" y="428" width="467" height="77" rx="11" class="result"/>
  <path d="M619 447 H633 L639 453 V470 H619 Z M633 447 V453 H639" fill="none" stroke="#C4A7FF" stroke-width="1.5"/>
  <text x="650" y="452" class="label">CSV file stored in S3</text>
  <text x="619" y="478" class="body">Database records become a timestamped CSV</text>
  <text x="619" y="494" class="small">exports/users-*.csv</text>

  <!-- Core outputs footer -->
  <rect x="30" y="530" width="1040" height="83" rx="13" fill="#101D2E" stroke="#31465F"/>
  <text x="49" y="552" fill="#A9BED9" font-size="11" font-weight="750">WHERE THE RESULTS LIVE</text>

  <rect x="49" y="565" width="225" height="32" rx="8" fill="#172D43" stroke="#405D7D"/>
  <circle cx="65" cy="581" r="4" fill="#60C9FA"/>
  <text x="77" y="585" font-size="11">ECR · Docker image</text>

  <rect x="287" y="565" width="225" height="32" rx="8" fill="#172D43" stroke="#405D7D"/>
  <circle cx="303" cy="581" r="4" fill="#4ADE80"/>
  <text x="315" y="585" font-size="11">EC2 · Running application</text>

  <rect x="525" y="565" width="225" height="32" rx="8" fill="#172D43" stroke="#405D7D"/>
  <circle cx="541" cy="581" r="4" fill="#F5C451"/>
  <text x="553" y="585" font-size="11">RDS · Live user records</text>

  <rect x="763" y="565" width="287" height="32" rx="8" fill="#172D43" stroke="#405D7D"/>
  <circle cx="779" cy="581" r="4" fill="#C4A7FF"/>
  <text x="791" y="585" font-size="11">S3 · Import and export CSV files</text>

  <text x="550" y="635" text-anchor="middle" class="subtitle">Manual trigger means you start the workflow; its configured steps then run automatically.</text>
</svg>
