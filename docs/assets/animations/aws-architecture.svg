
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">AWS Application Deployment Architecture</title>
  <desc id="desc">A spacious animated architecture diagram of the infra-deploy-aws-2 project, showing GitHub Actions, OIDC, Terraform, Ansible, ECR, two EC2 application servers in separate availability zones, private RDS MySQL, and S3 data import and export.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1729"/>
      <stop offset="100%" stop-color="#101c31"/>
    </linearGradient>

    <linearGradient id="automation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162b47"/>
      <stop offset="100%" stop-color="#101d31"/>
    </linearGradient>

    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12374a"/>
      <stop offset="100%" stop-color="#10263a"/>
    </linearGradient>

    <linearGradient id="standby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282747"/>
      <stop offset="100%" stop-color="#191f38"/>
    </linearGradient>

    <linearGradient id="database" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123a32"/>
      <stop offset="100%" stop-color="#102821"/>
    </linearGradient>

    <linearGradient id="storage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b301d"/>
      <stop offset="100%" stop-color="#252319"/>
    </linearGradient>

    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity=".20"/>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#6ea8ff" stroke-opacity=".035"/>
    </pattern>

    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#55c7ff"/>
    </marker>

    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4ade80"/>
    </marker>

    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#fbbf24"/>
    </marker>

    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b6a0ff"/>
    </marker>

    <style>
      text {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        fill: #e7f0ff;
      }

      .heading {
        font-size: 29px;
        font-weight: 750;
        letter-spacing: 1px;
      }

      .subtitle {
        font-size: 14px;
        fill: #a9bed8;
      }

      .section {
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 1.5px;
      }

      .label {
        font-size: 17px;
        font-weight: 700;
      }

      .body {
        font-size: 13px;
        fill: #c3d4e8;
      }

      .small {
        font-size: 11px;
        fill: #a9bed8;
      }

      .micro {
        font-size: 10px;
        fill: #9eb1c9;
      }

      .mono {
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 10px;
        letter-spacing: .35px;
      }

      .panel {
        fill: #0d1a2b;
        stroke: #29415e;
        stroke-width: 1.4;
      }

      .node {
        fill: #12243a;
        stroke: #3c5d80;
        stroke-width: 1.4;
      }

      .route {
        fill: none;
        stroke-width: 2.3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 7 8;
        animation: travel 1.7s linear infinite;
      }

      .blue {
        stroke: #55c7ff;
        marker-end: url(#arrowBlue);
      }

      .green {
        stroke: #4ade80;
        marker-end: url(#arrowGreen);
      }

      .amber {
        stroke: #fbbf24;
        marker-end: url(#arrowAmber);
      }

      .purple {
        stroke: #b6a0ff;
        marker-end: url(#arrowPurple);
      }

      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .float {
        animation: float 4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .delay {
        animation-delay: 1.1s;
      }

      @keyframes travel {
        to { stroke-dashoffset: -30; }
      }

      @keyframes pulse {
        0%, 100% { opacity: .65; }
        50% { opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .route, .pulse, .float { animation: none; }
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1500" height="1080" rx="26" fill="url(#bg)"/>
  <rect width="1500" height="1080" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1498" height="1078" rx="25" fill="none" stroke="#314761"/>

  <!-- Header -->
  <text x="54" y="54" class="heading">AWS APPLICATION DEPLOYMENT</text>
  <text x="55" y="81" class="subtitle">infra-deploy-aws-2 · Mumbai Region · Automated delivery, resilient applications, private data</text>

  <rect x="1164" y="35" width="280" height="40" rx="20" fill="#132b2a" stroke="#337b63"/>
  <circle cx="1187" cy="55" r="5" fill="#4ade80" class="pulse"/>
  <text x="1202" y="60" font-size="12" font-weight="700">TWO-AZ APPLICATION DESIGN</text>

  <!-- Automation area -->
  <rect x="45" y="112" width="1410" height="178" rx="20" fill="url(#automation)" stroke="#344e70" stroke-width="1.5"/>
  <text x="70" y="142" class="section" fill="#8dbdff">01 / AUTOMATION &amp; DELIVERY</text>
  <text x="1427" y="142" text-anchor="end" class="small">Code → Provision → Configure → Deploy</text>

  <!-- GitHub -->
  <g filter="url(#shadow)">
    <rect x="72" y="163" width="200" height="83" rx="14" class="node"/>
  </g>
  <circle cx="98" cy="190" r="10" fill="none" stroke="#dce9fb" stroke-width="1.8"/>
  <path d="M91 184l-4-5m18 5 4-5m-11 18v-5" fill="none" stroke="#dce9fb" stroke-width="1.6" stroke-linecap="round"/>
  <text x="122" y="190" class="label">GitHub</text>
  <text x="91" y="220" class="body">Source code + workflows</text>
  <text x="91" y="237" class="micro">Push to main / manual trigger</text>

  <!-- Actions -->
  <g filter="url(#shadow)">
    <rect x="317" y="163" width="220" height="83" rx="14" fill="#102840" stroke="#429ad0" stroke-width="1.5"/>
  </g>
  <path d="M340 187h20m-10-10v20m-7-7 7 7 7-7" fill="none" stroke="#71c7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="372" y="190" class="label">GitHub Actions</text>
  <text x="337" y="220" class="body">CI/CD workflows</text>
  <text x="337" y="237" class="micro">Deploy · import · export · test</text>

  <!-- OIDC -->
  <g filter="url(#shadow)">
    <rect x="582" y="163" width="200" height="83" rx="14" fill="#211d3e" stroke="#8b7de5" stroke-width="1.5"/>
  </g>
  <path d="M605 181l11-5 11 5v9c0 8-6 13-11 16-6-3-11-8-11-16z" fill="none" stroke="#b6a0ff" stroke-width="1.7"/>
  <path d="M611 190l4 4 7-8" fill="none" stroke="#b6a0ff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="638" y="190" class="label">OIDC + AWS STS</text>
  <text x="602" y="220" class="body">Temporary credentials</text>
  <text x="602" y="237" class="micro">No long-lived AWS access keys</text>

  <!-- Terraform -->
  <g filter="url(#shadow)">
    <rect x="827" y="163" width="200" height="83" rx="14" fill="#211e3b" stroke="#9b85f6" stroke-width="1.5"/>
  </g>
  <path d="M850 180l10-5 10 5v12l-10 5-10-5z" fill="none" stroke="#b6a0ff" stroke-width="1.7"/>
  <path d="M860 175v22m-10-17 10 5 10-5" fill="none" stroke="#b6a0ff" stroke-width="1.3"/>
  <text x="882" y="190" class="label">Terraform</text>
  <text x="847" y="220" class="body">Infrastructure as code</text>
  <text x="847" y="237" class="micro">VPC · EC2 · RDS · IAM · S3</text>

  <!-- Ansible -->
  <g filter="url(#shadow)">
    <rect x="1072" y="163" width="200" height="83" rx="14" fill="#17302b" stroke="#4caa81" stroke-width="1.5"/>
  </g>
  <circle cx="1097" cy="187" r="10" fill="none" stroke="#79e3b5" stroke-width="1.7"/>
  <path d="M1092 187l4 4 7-9" fill="none" stroke="#79e3b5" stroke-width="1.7" stroke-linecap="round"/>
  <text x="1117" y="190" class="label">Ansible</text>
  <text x="1092" y="220" class="body">Host configuration</text>
  <text x="1092" y="237" class="micro">Docker · Nginx · app setup</text>

  <!-- Control arrows -->
  <path d="M272 204H313" class="route blue"/>
  <path d="M537 204H578" class="route purple"/>
  <path d="M782 204H823" class="route purple"/>
  <path d="M1027 204H1068" class="route green"/>

  <!-- State bucket note -->
  <rect x="1290" y="163" width="137" height="83" rx="13" fill="#30291d" stroke="#a77a35"/>
  <path d="M1311 181l10-5 10 5v12l-10 5-10-5z" fill="none" stroke="#f6c96a" stroke-width="1.6"/>
  <text x="1342" y="190" font-size="12" font-weight="700">S3 State</text>
  <text x="1305" y="220" class="micro">Terraform remote</text>
  <text x="1305" y="236" class="micro">state + lockfile</text>
  <path d="M927 246V265H1290V246" fill="none" stroke="#d6a84f" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- AWS Region boundary -->
  <rect x="45" y="317" width="1410" height="710" rx="23" fill="#0a1626" stroke="#466b93" stroke-width="1.8"/>
  <rect x="68" y="300" width="335" height="37" rx="11" fill="#1a3452" stroke="#466b93"/>
  <text x="86" y="324" font-size="17" font-weight="750">AWS CLOUD · ap-south-1</text>
  <text x="1425" y="325" text-anchor="end" class="small">Mumbai Region</text>

  <!-- Internet access -->
  <rect x="76" y="356" width="200" height="73" rx="13" fill="#12253b" stroke="#3c6689" stroke-width="1.4"/>
  <circle cx="101" cy="380" r="12" fill="none" stroke="#76cfff" stroke-width="1.7"/>
  <path d="M89 380h24m-12-12c-7 8-7 16 0 24m0-24c7 8 7 16 0 24" fill="none" stroke="#76cfff" stroke-width="1.4"/>
  <text x="125" y="382" class="label">Internet</text>
  <text x="96" y="409" class="small">Users · HTTP :80</text>

  <!-- VPC -->
  <rect x="306" y="356" width="1125" height="485" rx="20" fill="#0d1b2c" stroke="#8b7de5" stroke-opacity=".8" stroke-width="1.7"/>
  <rect x="328" y="342" width="255" height="32" rx="10" fill="#282748" stroke="#786bc4"/>
  <text x="345" y="363" font-size="16" font-weight="750">VPC · 10.0.0.0/16</text>
  <text x="1407" y="365" text-anchor="end" class="small">Public app subnets + private database</text>

  <!-- Internet route into App-1 -->
  <path d="M276 392H296V481H366" class="route blue"/>
  <text x="290" y="454" class="micro">Public route</text>

  <!-- AZ 1a -->
  <rect x="345" y="395" width="455" height="270" rx="17" fill="#0c2033" stroke="#3485ad" stroke-width="1.5"/>
  <text x="367" y="424" class="label">Availability Zone 1a</text>
  <text x="367" y="445" class="small">Public subnet · 10.0.1.0/24</text>

  <rect x="367" y="465" width="411" height="174" rx="14" fill="url(#primary)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="385" y="480" width="93" height="24" rx="12" fill="#15536a"/>
  <text x="431" y="496" text-anchor="middle" font-size="11" font-weight="750">PRIMARY</text>
  <circle cx="749" cy="492" r="5" fill="#4ade80" class="pulse"/>
  <text x="386" y="530" class="label">EC2 · App-1</text>
  <text x="386" y="551" class="body">Nginx reverse proxy · :80</text>
  <path d="M386 564H758" stroke="#315d79"/>
  <rect x="386" y="578" width="175" height="44" rx="9" fill="#152c43" stroke="#46708f"/>
  <text x="473" y="596" text-anchor="middle" font-size="12" font-weight="700">Docker</text>
  <text x="473" y="612" text-anchor="middle" class="small">Node.js + Express :8080</text>
  <rect x="573" y="578" width="185" height="44" rx="9" fill="#12352e" stroke="#378c68"/>
  <text x="665" y="596" text-anchor="middle" font-size="12" font-weight="700">App checks</text>
  <text x="665" y="612" text-anchor="middle" class="small">/health · /db</text>

  <!-- AZ 1b -->
  <rect x="824" y="395" width="455" height="270" rx="17" fill="#101d35" stroke="#7770c2" stroke-width="1.5"/>
  <text x="846" y="424" class="label">Availability Zone 1b</text>
  <text x="846" y="445" class="small">Public subnet · 10.0.4.0/24</text>

  <rect x="846" y="465" width="411" height="174" rx="14" fill="url(#standby)" stroke="#9c8df5" stroke-width="1.5"/>
  <rect x="864" y="480" width="93" height="24" rx="12" fill="#39315f"/>
  <text x="910" y="496" text-anchor="middle" font-size="11" font-weight="750">STANDBY</text>
  <circle cx="1228" cy="492" r="5" fill="#fbbf24" class="pulse delay"/>
  <text x="865" y="530" class="label">EC2 · App-2</text>
  <text x="865" y="551" class="body">Backup application server</text>
  <path d="M865 564H1237" stroke="#46436f"/>
  <rect x="865" y="578" width="175" height="44" rx="9" fill="#1a2540" stroke="#625a98"/>
  <text x="952" y="596" text-anchor="middle" font-size="12" font-weight="700">Docker</text>
  <text x="952" y="612" text-anchor="middle" class="small">Node.js + Express :8080</text>
  <rect x="1052" y="578" width="185" height="44" rx="9" fill="#20233b" stroke="#625a98"/>
  <text x="1144" y="596" text-anchor="middle" font-size="12" font-weight="700">Same app image</text>
  <text x="1144" y="612" text-anchor="middle" class="small">Pulled from ECR</text>

  <!-- App-to-app failover -->
  <path d="M778 544H846" class="route amber"/>
  <rect x="751" y="507" width="120" height="25" rx="12" fill="#342d1d" stroke="#8f7134"/>
  <text x="811" y="523" text-anchor="middle" fill="#f9d17c" font-size="10">Backup route</text>

  <!-- ECR -->
  <rect x="76" y="466" width="200" height="112" rx="15" fill="#102b3c" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M97 491l12-7 12 7v15l-12 7-12-7z" fill="none" stroke="#67e8f9" stroke-width="1.7"/>
  <path d="M97 491l12 7 12-7m-12 7v15" fill="none" stroke="#67e8f9" stroke-width="1.4"/>
  <text x="133" y="495" class="label">Amazon ECR</text>
  <text x="97" y="535" class="body">Docker image registry</text>
  <text x="97" y="554" class="small">Versioned app image</text>
  <path d="M276 522H330V602H367" class="route blue"/>
  <path d="M330 602V641H824V602H846" class="route blue"/>
  <text x="294" y="592" class="micro">Pull image</text>

  <!-- Private database area -->
  <rect x="345" y="691" width="934" height="126" rx="17" fill="#101f2b" stroke="#4a927a" stroke-width="1.5"/>
  <text x="368" y="718" class="label">Private database subnets</text>
  <text x="368" y="740" class="small">10.0.2.0/24 · AZ 1a</text>
  <text x="368" y="758" class="small">10.0.3.0/24 · AZ 1b</text>

  <rect x="720" y="708" width="535" height="89" rx="13" fill="url(#database)" stroke="#4ade80" stroke-width="1.6"/>
  <ellipse cx="754" cy="734" rx="13" ry="5" fill="none" stroke="#75e8b0" stroke-width="1.7"/>
  <path d="M741 734v20c0 7 26 7 26 0v-20m-26 10c0 7 26 7 26 0" fill="none" stroke="#75e8b0" stroke-width="1.7"/>
  <text x="783" y="737" class="label">Amazon RDS MySQL</text>
  <text x="783" y="758" class="body">appdb · private endpoint · TCP :3306</text>
  <text x="783" y="779" class="small">Shared relational data · Single-AZ DB deployment</text>

  <!-- Database connections -->
  <path d="M574 639V672H800V708" class="route green"/>
  <path d="M1050 639V672H1105V708" class="route green"/>

  <!-- Data S3 outside VPC -->
  <rect x="1300" y="391" width="125" height="246" rx="15" fill="url(#storage)" stroke="#d6a84f" stroke-width="1.5"/>
  <path d="M1337 423l13-7 13 7v16l-13 7-13-7z" fill="none" stroke="#f6c96a" stroke-width="1.8"/>
  <path d="M1337 423l13 8 13-8m-13 8v15" fill="none" stroke="#f6c96a" stroke-width="1.4"/>
  <text x="1362" y="470" text-anchor="middle" font-size="16" font-weight="750">Amazon S3</text>
  <text x="1362" y="491" text-anchor="middle" class="micro">App data</text>
  <path d="M1317 506H1408" stroke="#715a30"/>
  <text x="1362" y="530" text-anchor="middle" class="small">imports/</text>
  <text x="1362" y="548" text-anchor="middle" class="micro">users.csv</text>
  <text x="1362" y="578" text-anchor="middle" class="small">exports/</text>
  <text x="1362" y="596" text-anchor="middle" class="micro">timestamped CSV</text>
  <text x="1362" y="619" text-anchor="middle" class="micro">Scoped EC2 role</text>

  <!-- S3 bridge via EC2 App-1 -->
  <path d="M1300 475H1288V450H1267" class="route green"/>
  <path d="M1267 633H1288V610H1300" class="route amber"/>
  <text x="1290" y="425" text-anchor="middle" class="micro">CSV in</text>
  <text x="1290" y="654" text-anchor="middle" class="micro">CSV out</text>
  <rect x="1290" y="676" width="135" height="88" rx="13" fill="#17253a" stroke="#4a6383"/>
  <text x="1357" y="700" text-anchor="middle" font-size="12" font-weight="700">Data flow</text>
  <text x="1357" y="721" text-anchor="middle" class="small">S3 → EC2 → RDS</text>
  <text x="1357" y="740" text-anchor="middle" class="small">RDS → EC2 → S3</text>

  <!-- Security and service notes -->
  <rect x="76" y="859" width="650" height="119" rx="16" fill="#101d2d" stroke="#344d6b"/>
  <text x="99" y="887" class="section" fill="#8dbdff">SECURITY BOUNDARIES</text>
  <text x="99" y="914" class="body">HTTP :80 · public app entry</text>
  <text x="99" y="936" class="body">MySQL :3306 · allowed from EC2 security group</text>
  <text x="99" y="958" class="small">SSH :22 is currently publicly exposed in this project.</text>

  <rect x="746" y="859" width="679" height="119" rx="16" fill="#101d2d" stroke="#344d6b"/>
  <text x="770" y="887" class="section" fill="#9debb0">HOW THE COMPONENTS WORK TOGETHER</text>
  <text x="770" y="914" class="body">Terraform provisions · Ansible configures · GitHub Actions deploys and tests</text>
  <text x="770" y="936" class="body">ECR stores images · EC2 runs the app · RDS stores records · S3 stores CSV files</text>
  <text x="770" y="958" class="small">App-1 hosts Nginx; the manual test checks routing to App-2 and recovery.</text>

  <!-- Footer -->
  <path d="M76 1000H1425" stroke="#29415e"/>
  <circle cx="86" cy="1040" r="5" fill="#4ade80" class="pulse"/>
  <text x="102" y="1045" class="small">INFRASTRUCTURE · APPLICATION · DATA</text>
  <text x="750" y="1045" text-anchor="middle" class="small">A clear view of the complete deployment project</text>
  <text x="1425" y="1045" text-anchor="end" class="small">AWS · ap-south-1</text>
</svg>
