
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Application Request and Database Flow</title>
  <desc id="desc">Browser requests pass through Nginx on port 80 to a Node.js Express Docker container on port 8080, which queries private Amazon RDS MySQL on port 3306 and returns a response.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091525"/>
      <stop offset="100%" stop-color="#132641"/>
    </linearGradient>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#60c9fa"/>
    </marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#4ade80"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#edf5ff}
      .title{font-size:24px;font-weight:700}
      .muted{font-size:14px;fill:#a9bfd9}
      .label{font-size:17px;font-weight:700}
      .body{font-size:13px;fill:#cbd9e9}
      .box{fill:#132943;stroke:#4b7197;stroke-width:1.5}
      .db{fill:#132f2e;stroke:#4ade80;stroke-width:1.5}
      .blue{fill:none;stroke:#60c9fa;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#blueArrow);animation:flow 1.5s linear infinite}
      .green{fill:none;stroke:#4ade80;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#greenArrow);animation:flow 1.5s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-26}}
      @media(prefers-reduced-motion:reduce){.blue,.green{animation:none}}
    </style>
  </defs>

  <rect width="1000" height="470" rx="20" fill="url(#bg)"/>

  <text x="30" y="42" class="title">HOW THE APPLICATION WORKS</text>
  <text x="30" y="68" class="muted">Request → Application logic → Database query → Response</text>

  <!-- Browser -->
  <rect x="30" y="132" width="175" height="116" rx="13" class="box"/>
  <rect x="48" y="150" width="139" height="34" rx="7" fill="#1c3c5a" stroke="#47769d"/>
  <circle cx="60" cy="161" r="3" fill="#fb7185"/>
  <circle cx="70" cy="161" r="3" fill="#fbbf24"/>
  <circle cx="80" cy="161" r="3" fill="#4ade80"/>
  <text x="117" y="177" text-anchor="middle" class="body">Browser UI</text>
  <text x="117" y="207" text-anchor="middle" class="label">User request</text>
  <text x="117" y="229" text-anchor="middle" class="body">View / add / edit / delete</text>

  <!-- Nginx -->
  <path d="M205 190 H237" class="blue"/>
  <text x="220" y="177" text-anchor="middle" class="body">HTTP</text>
  <rect x="242" y="132" width="170" height="116" rx="13" class="box"/>
  <text x="327" y="164" text-anchor="middle" class="label">Nginx</text>
  <text x="327" y="189" text-anchor="middle" class="body">Reverse proxy</text>
  <text x="327" y="211" text-anchor="middle" class="body">Public port :80</text>
  <text x="327" y="232" text-anchor="middle" class="body">Forwards to :8080</text>

  <!-- App container -->
  <path d="M412 190 H444" class="blue"/>
  <rect x="449" y="111" width="265" height="158" rx="15" fill="#10263c" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="449" y="111" width="265" height="36" rx="13" fill="#174363"/>
  <text x="467" y="135" font-size="16" font-weight="700">Docker · Node.js App</text>
  <text x="467" y="170" class="body">Express.js routes</text>
  <text x="467" y="193" class="body">User CRUD operations</text>
  <text x="467" y="216" class="body">GET /health • GET /db</text>
  <text x="467" y="239" class="body">Port :8080</text>
  <text x="467" y="257" class="muted">Validates requests and runs logic</text>

  <!-- Database -->
  <path d="M714 190 H748" class="green"/>
  <text x="731" y="176" text-anchor="middle" class="body">SQL</text>
  <rect x="753" y="132" width="217" height="116" rx="13" class="db"/>
  <ellipse cx="861" cy="157" rx="30" ry="9" fill="#17483d" stroke="#4ade80" stroke-width="1.5"/>
  <path d="M831 157 V187 C831 199 891 199 891 187 V157 M831 173 C831 185 891 185 891 173" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <text x="861" y="216" text-anchor="middle" class="label">RDS MySQL</text>
  <text x="861" y="236" text-anchor="middle" class="body">Private :3306</text>

  <!-- Return path -->
  <path d="M861 248 V310 H580 V274" class="green"/>
  <text x="730" y="301" text-anchor="middle" class="body">Query result / stored records</text>
  <path d="M449 274 V340 H327 V253" class="blue"/>
  <text x="384" y="330" text-anchor="middle" class="body">HTTP response</text>

  <!-- Operations -->
  <rect x="30" y="370" width="940" height="66" rx="12" fill="#101f34" stroke="#344d6c"/>
  <text x="49" y="394" font-size="14" font-weight="700" fill="#7dd3fc">WHAT IT DOES</text>
  <text x="49" y="418" class="body">Create • Read • Update • Delete users</text>
  <path d="M370 383 V423" stroke="#344d6c"/>
  <text x="393" y="394" font-size="14" font-weight="700" fill="#4ade80">DATABASE SECURITY</text>
  <text x="393" y="418" class="body">RDS stays private; port 3306 is allowed from the EC2 security group.</text>
</svg>
