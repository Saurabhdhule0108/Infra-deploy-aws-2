
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AWS Infrastructure Deployment and Automation</title>
  <desc id="desc">A cinematic animated AWS project banner. The project name remains centered while deployment concepts appear one by one with glowing impact effects.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050916"/>
      <stop offset=".52" stop-color="#101B35"/>
      <stop offset="1" stop-color="#170F30"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="250" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DEBFF"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B5A1FF"/>
    </linearGradient>

    <linearGradient id="spectrum" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43D9FF"/>
      <stop offset=".34" stop-color="#8D7CFF"/>
      <stop offset=".67" stop-color="#4AF0C1"/>
      <stop offset="1" stop-color="#FFBE70"/>
    </linearGradient>

    <radialGradient id="centerGlow">
      <stop stop-color="#347DFF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#347DFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8EBFFF" stroke-opacity=".07"/>
      <circle cx="0" cy="0" r="1.2" fill="#A9D7FF" fill-opacity=".22"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      text {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .eyebrow {
        fill: #83E9FF;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 4px;
      }

      .project {
        fill: url(#titleGradient);
        font-size: 36px;
        font-weight: 850;
        letter-spacing: 1px;
      }

      .projectSub {
        fill: #A9BEDB;
        font-size: 12px;
        letter-spacing: 3px;
      }

      .concept {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: conceptSequence 16s linear infinite;
      }

      .conceptName {
        font-size: 27px;
        font-weight: 850;
        letter-spacing: 4px;
        text-anchor: middle;
        fill: #FFFFFF;
      }

      .conceptDetail {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        text-anchor: middle;
        fill: #A8C5E8;
      }

      .c1 { --slot: 0%; }
      .c2 { --slot: 12.5%; }
      .c3 { --slot: 25%; }
      .c4 { --slot: 37.5%; }
      .c5 { --slot: 50%; }
      .c6 { --slot: 62.5%; }
      .c7 { --slot: 75%; }
      .c8 { --slot: 87.5%; }

      .concept {
        animation-name: conceptSequence;
        animation-duration: 16s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }

      .c1 { animation-delay: 0s; }
      .c2 { animation-delay: 0s; }
      .c3 { animation-delay: 0s; }
      .c4 { animation-delay: 0s; }
      .c5 { animation-delay: 0s; }
      .c6 { animation-delay: 0s; }
      .c7 { animation-delay: 0s; }
      .c8 { animation-delay: 0s; }

      .beam {
        stroke-dasharray: 5 12;
        animation: beamFlow 2.2s linear infinite;
      }

      .beamReverse {
        stroke-dasharray: 3 13;
        animation: beamFlowReverse 3s linear infinite;
      }

      .orbit {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbit 18s linear infinite;
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: ring 2s ease-out infinite;
      }

      .spark {
        animation: spark 2.5s ease-in-out infinite;
      }

      @keyframes conceptSequence {
        0% {
          opacity: 0;
          transform: scale(.72) translateY(12px);
        }
        1.5% {
          opacity: 1;
          transform: scale(1.10) translateY(0);
        }
        3% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
        10% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
        12.5% {
          opacity: 0;
          transform: scale(1.16) translateY(-7px);
        }
        100% {
          opacity: 0;
          transform: scale(.8) translateY(10px);
        }
      }

      /* Each concept gets its own 12.5% window of the 16-second cycle. */
      .c1 { animation-name: concept1; }
      .c2 { animation-name: concept2; }
      .c3 { animation-name: concept3; }
      .c4 { animation-name: concept4; }
      .c5 { animation-name: concept5; }
      .c6 { animation-name: concept6; }
      .c7 { animation-name: concept7; }
      .c8 { animation-name: concept8; }

      @keyframes concept1 {
        0%, 1.5% { opacity: 0; transform: scale(.72) translateY(12px); }
        3% { opacity: 1; transform: scale(1.1); }
        4.5%, 10% { opacity: 1; transform: scale(1); }
        12.5%, 100% { opacity: 0; transform: scale(1.12) translateY(-5px); }
      }
      @keyframes concept2 {
        0%, 12.5% { opacity: 0; transform: scale(.72) translateY(12px); }
        14% { opacity: 1; transform: scale(1.1); }
        15.5%, 22.5% { opacity: 1; transform: scale(1); }
        25%, 100% { opacity: 0; transform: scale(1.12) translateY(-5px); }
      }
      @keyframes concept3 {
        0%, 25% { opacity: 0; transform: scale(.72) translateY(12px); }
        26.5% { opacity: 1; transform: scale(1.1); }
        28%, 35% { opacity: 1; transform: scale(1); }
        37.5%, 100% { opacity: 0; transform: scale(1.12) translateY(-5px); }
      }
      @keyframes concept4 {
        0%, 37.5% { opacity: 0; transform: scale(.72) translateY(12px); }
        39% { opacity: 1; transform: scale(1.1); }
        40.5%, 47.5% { opacity: 1; transform: scale(1); }
        50%, 100% { opacity: 0; transform: scale(1.12) translateY(-5px); }
      }
      @keyframes concept5 {
        0%, 50% { opacity: 0; transform: scale(.72) translateY(12px); }
        51.5% { opacity: 1; transform: scale(1.1); }
        53%, 60% { opacity: 1; transform: scale(1); }
        62.5%, 100% { opacity: 0; transform: scale(1.12) translateY(-5px); }
      }
      @keyframes concept6 {
        0%, 62.5% { opacity: 0; transform: scale(.72) translateY(12px); }
        64% { opacity: 1; transform: scale(1.1); }
        65.5%, 72.5% { opacity: 1; transform: scale(1); }
        75%, 100% { opacity: 0; transform: scale(1.12) translateY(-5px); }
      }
      @keyframes concept7 {
        0%, 75% { opacity: 0; transform: scale(.72) translateY(12px); }
        76.5% { opacity: 1; transform: scale(1.1); }
        78%, 85% { opacity: 1; transform: scale(1); }
        87.5%, 100% { opacity: 0; transform: scale(1.12) translateY(-5px); }
      }
      @keyframes concept8 {
        0%, 87.5% { opacity: 0; transform: scale(.72) translateY(12px); }
        89% { opacity: 1; transform: scale(1.1); }
        90.5%, 97.5% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.12) translateY(-5px); }
      }

      @keyframes beamFlow {
        to { stroke-dashoffset: -68; }
      }

      @keyframes beamFlowReverse {
        to { stroke-dashoffset: 64; }
      }

      @keyframes orbit {
        to { transform: rotate(360deg); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes pulse {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
      }

      @keyframes ring {
        0% { opacity: .9; transform: scale(.35); }
        100% { opacity: 0; transform: scale(1.8); }
      }

      @keyframes spark {
        0%, 100% { opacity: .25; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Cinematic background -->
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>
  <ellipse cx="600" cy="185" rx="490" ry="250" fill="url(#centerGlow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="21" stroke="#799BCB" stroke-opacity=".36"/>

  <!-- Moving background lights -->
  <g class="orbit" opacity=".55">
    <circle cx="600" cy="205" r="185" stroke="#57CFFF" stroke-opacity=".16" stroke-dasharray="3 12"/>
    <circle cx="600" cy="205" r="225" stroke="#A18AFF" stroke-opacity=".13" stroke-dasharray="2 17"/>
  </g>

  <g fill="#A8E8FF">
    <circle class="spark" cx="100" cy="80" r="2"/>
    <circle class="spark" cx="190" cy="300" r="1.5"/>
    <circle class="spark" cx="325" cy="65" r="1.6"/>
    <circle class="spark" cx="450" cy="330" r="2"/>
    <circle class="spark" cx="790" cy="65" r="1.7"/>
    <circle class="spark" cx="900" cy="315" r="1.5"/>
    <circle class="spark" cx="1060" cy="95" r="2"/>
    <circle class="spark" cx="1110" cy="265" r="1.5"/>
  </g>

  <!-- Animated network lines -->
  <g fill="none" stroke-width="1.5">
    <path d="M0 130H190L240 180H350" stroke="#56DFFF" stroke-opacity=".35" class="beam"/>
    <path d="M1200 130H1010L960 180H850" stroke="#A68AFF" stroke-opacity=".4" class="beamReverse"/>
    <path d="M0 290H210L260 250H380" stroke="#58E8CB" stroke-opacity=".28" class="beamReverse"/>
    <path d="M1200 290H990L940 250H820" stroke="#5B9CFF" stroke-opacity=".3" class="beam"/>
  </g>

  <!-- Persistent top label -->
  <g>
    <circle cx="370" cy="54" r="3.5" fill="#58E8C6" filter="url(#glow)" class="pulse"/>
    <text x="600" y="58" text-anchor="middle" class="eyebrow">REAL-WORLD CLOUD ENGINEERING PROJECT</text>
    <circle cx="830" cy="54" r="3.5" fill="#58E8C6" filter="url(#glow)" class="pulse"/>
  </g>

  <!-- Project name remains visible throughout -->
  <g class="float">
    <text x="600" y="126" text-anchor="middle" class="project">AWS INFRASTRUCTURE</text>
    <text x="600" y="169" text-anchor="middle" class="project">DEPLOYMENT &amp; AUTOMATION</text>
    <text x="600" y="195" text-anchor="middle" class="projectSub">BUILD  ·  AUTOMATE  ·  VERIFY  ·  RECOVER</text>
  </g>

  <!-- Impact flash behind each changing concept -->
  <circle cx="600" cy="258" r="56" fill="#53CFFF" opacity=".035" class="pulse"/>
  <circle cx="600" cy="258" r="39" stroke="#6DE8FF" stroke-width="1.5" opacity=".35" class="ring"/>
  <circle cx="600" cy="258" r="39" stroke="#B19AFF" stroke-width="1.5" opacity=".25" class="ring"/>

  <!-- 1: Deployment -->
  <g class="concept c1">
    <text x="600" y="260" class="conceptName" fill="#77E8FF" filter="url(#glow)">DEPLOYMENT</text>
    <text x="600" y="284" class="conceptDetail">GITHUB ACTIONS · CI/CD PIPELINE</text>
  </g>

  <!-- 2: Terraform -->
  <g class="concept c2">
    <text x="600" y="260" class="conceptName" fill="#B2A0FF" filter="url(#glow)">TERRAFORM</text>
    <text x="600" y="284" class="conceptDetail">INFRASTRUCTURE AS CODE</text>
  </g>

  <!-- 3: Networking -->
  <g class="concept c3">
    <text x="600" y="260" class="conceptName" fill="#69D8FF" filter="url(#glow)">AWS NETWORKING</text>
    <text x="600" y="284" class="conceptDetail">VPC · SUBNETS · SECURITY GROUPS</text>
  </g>

  <!-- 4: Containers -->
  <g class="concept c4">
    <text x="600" y="260" class="conceptName" fill="#75F0C7" filter="url(#glow)">DOCKER &amp; ECR</text>
    <text x="600" y="284" class="conceptDetail">BUILD · STORE · RUN CONTAINERS</text>
  </g>

  <!-- 5: Configuration management -->
  <g class="concept c5">
    <text x="600" y="260" class="conceptName" fill="#FFC985" filter="url(#glow)">ANSIBLE</text>
    <text x="600" y="284" class="conceptDetail">CONFIGURATION AUTOMATION</text>
  </g>

  <!-- 6: Database -->
  <g class="concept c6">
    <text x="600" y="260" class="conceptName" fill="#76F2D1" filter="url(#glow)">RDS &amp; MYSQL</text>
    <text x="600" y="284" class="conceptDetail">DYNAMIC APPLICATION DATA</text>
  </g>

  <!-- 7: S3 integration -->
  <g class="concept c7">
    <text x="600" y="260" class="conceptName" fill="#7CCBFF" filter="url(#glow)">S3 DATA INTEGRATION</text>
    <text x="600" y="284" class="conceptDetail">CSV IMPORT · DATABASE EXPORT</text>
  </g>

  <!-- 8: Failover -->
  <g class="concept c8">
    <text x="600" y="260" class="conceptName" fill="#C1A5FF" filter="url(#glow)">FAILOVER &amp; RECOVERY</text>
    <text x="600" y="284" class="conceptDetail">VERIFY · SWITCH · RESTORE</text>
  </g>

  <!-- Continuous lower timeline -->
  <g>
    <path d="M100 338H1100" stroke="#7392BD" stroke-opacity=".3"/>
    <path d="M100 338H1100" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".8" class="beam"/>
    <circle cx="100" cy="338" r="4" fill="#5FE6FF" filter="url(#glow)"/>
    <circle cx="350" cy="338" r="4" fill="#A18AFF" filter="url(#glow)"/>
    <circle cx="600" cy="338" r="4" fill="#59E6C0" filter="url(#glow)"/>
    <circle cx="850" cy="338" r="4" fill="#A18AFF" filter="url(#glow)"/>
    <circle cx="1100" cy="338" r="4" fill="#FFC985" filter="url(#glow)"/>
  </g>

  <!-- Bottom signature -->
  <text x="600" y="377" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#A6BCD9">
    TERRAFORM  ·  AUTOMATION  ·  CONTAINERS  ·  DATA  ·  RESILIENCE
  </text>

  <text x="600" y="399" text-anchor="middle" font-size="9" letter-spacing="2" fill="#607B9F">
    AWS CLOUD ENGINEERING PORTFOLIO
  </text>
</svg>
