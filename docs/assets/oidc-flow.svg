<svg width="1200" height="390" viewBox="0 0 1200 390"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#58A6FF"/>
    </marker>

  </defs>

  <rect width="1200" height="390" rx="22" fill="url(#bg)"/>

  <text x="600" y="55"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="27"
        font-weight="700"
        fill="#F0F6FC">
    PASSWORDLESS AWS AUTHENTICATION
  </text>

  <text x="600" y="84"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="12"
        letter-spacing="2"
        fill="#58A6FF">
    GITHUB OIDC • IAM TRUST • AWS STS • TEMPORARY CREDENTIALS
  </text>

  <!-- boxes -->

  <g>
    <rect x="70" y="145" width="190" height="100" rx="15"
          fill="#111827" stroke="#58A6FF"/>

    <text x="165" y="185"
          text-anchor="middle"
          font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="17"
          font-weight="700"
          fill="#F0F6FC">
      GitHub Actions
    </text>

    <text x="165" y="213"
          text-anchor="middle"
          font-family="JetBrains Mono,Consolas,monospace"
          font-size="11"
          fill="#8B949E">
      CI/CD WORKFLOW
    </text>
  </g>

  <g>
    <rect x="330" y="145" width="190" height="100" rx="15"
          fill="#111827" stroke="#58A6FF"/>

    <text x="425" y="185"
          text-anchor="middle"
          font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="17"
          font-weight="700"
          fill="#F0F6FC">
      OIDC Token
    </text>

    <text x="425" y="213"
          text-anchor="middle"
          font-family="JetBrains Mono,Consolas,monospace"
          font-size="11"
          fill="#58A6FF">
      SIGNED IDENTITY
    </text>
  </g>

  <g>
    <rect x="590" y="145" width="190" height="100" rx="15"
          fill="#111827" stroke="#A78BFA"/>

    <text x="685" y="185"
          text-anchor="middle"
          font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="17"
          font-weight="700"
          fill="#F0F6FC">
      AWS STS
    </text>

    <text x="685" y="213"
          text-anchor="middle"
          font-family="JetBrains Mono,Consolas,monospace"
          font-size="11"
          fill="#C4B5FD">
      VALIDATE + ASSUME ROLE
    </text>
  </g>

  <g>
    <rect x="850" y="145" width="280" height="100" rx="15"
          fill="#111827" stroke="#3FB950"/>

    <text x="990" y="185"
          text-anchor="middle"
          font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="17"
          font-weight="700"
          fill="#F0F6FC">
      Temporary Credentials
    </text>

    <text x="990" y="213"
          text-anchor="middle"
          font-family="JetBrains Mono,Consolas,monospace"
          font-size="11"
          fill="#7EE787">
      SHORT-LIVED AWS ACCESS
    </text>
  </g>

  <!-- paths -->

  <path d="M260 195H330"
        stroke="#58A6FF"
        stroke-width="2"
        fill="none"
        marker-end="url(#arrow)"/>

  <path d="M520 195H590"
        stroke="#A78BFA"
        stroke-width="2"
        fill="none"
        marker-end="url(#arrow)"/>

  <path d="M780 195H850"
        stroke="#3FB950"
        stroke-width="2"
        fill="none"
        marker-end="url(#arrow)"/>

  <!-- moving token -->

  <circle r="6" fill="#58A6FF" filter="url(#glow)">
    <animateMotion
      path="M260 195H330"
      dur="1.8s"
      repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#A78BFA" filter="url(#glow)">
    <animateMotion
      path="M520 195H590"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#3FB950" filter="url(#glow)">
    <animateMotion
      path="M780 195H850"
      dur="2.2s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Role ARN -->

  <path d="M165 245 V295 H685 V245"
        fill="none"
        stroke="#30363D"
        stroke-width="2"
        stroke-dasharray="6 6"/>

  <text x="425" y="320"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="11"
        fill="#8B949E">
    WORKFLOW SPECIFIES IAM ROLE ARN
  </text>

  <circle cx="1080" cy="315" r="5" fill="#3FB950">
    <animate attributeName="opacity"
             values="1;0.25;1"
             dur="1.5s"
             repeatCount="indefinite"/>
  </circle>

  <text x="1065" y="320"
        text-anchor="end"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="11"
        fill="#7EE787">
    NO LONG-LIVED AWS KEYS
  </text>

</svg>