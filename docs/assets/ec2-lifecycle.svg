<text x="600" y="375" text-anchor="middle" font-family="Consolas" font-size="11" fill="#8B949E">PUBLIC IP MAY CHANGE AFTER RESTART • WORKFLOW DISCOVERS THE CURRENT IP AUTOMATICALLY</text>
