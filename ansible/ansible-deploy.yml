
---
- name: Verify application servers
  hosts: app_servers
  gather_facts: false

  tasks:
    - name: Check Ansible connectivity
      ansible.builtin.ping:

- name: Configure Nginx on primary application server
  hosts: primary
  become: true
  gather_facts: false

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Deploy active-passive Nginx configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/infra-deploy-aws-app
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Enable application Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/infra-deploy-aws-app
        dest: /etc/nginx/sites-enabled/infra-deploy-aws-app
        state: link
      notify: Restart Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Apply pending Nginx restart
      ansible.builtin.meta: flush_handlers

    - name: Verify Nginx service
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      failed_when: nginx_status.stdout != "active"

  handlers:
    - name: Restart Nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
